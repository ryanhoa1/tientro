<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản Lý Tiền Trọ</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a6c5a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar + ledger-style workspace; meter-dial inputs are the signature detail */
:root{
  --bg:#edf1ef; --surface:#ffffff; --surface2:#f5f8f6; --ink:#10201b; --muted:#566660; --line:#d6dfdb; --line2:#b9c6c0;
  --accent:#0a6c5a; --accent-ink:#ffffff; --accent-soft:#d9efe8;
  --elec:#a86300; --elec-soft:#fbeed2; --water:#17679e; --water-soft:#dcedf8;
  --ok:#1b7f46; --ok-soft:#dcf2e4; --warn:#9a5b00; --warn-soft:#fbedcf; --bad:#b3321f; --bad-soft:#fbe2dc;
  --dial:#14231e; --dial-ink:#c9f7e7; --shadow:0 1px 2px rgba(16,32,27,.06),0 4px 14px rgba(16,32,27,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1512; --surface:#15201c; --surface2:#1a2823; --ink:#e6f0ec; --muted:#95a7a0; --line:#263731; --line2:#38504a;
  --accent:#3fcfb1; --accent-ink:#04231c; --accent-soft:#12372e;
  --elec:#f0b04a; --elec-soft:#3a2c10; --water:#64b5ee; --water-soft:#11304a;
  --ok:#5fd08b; --ok-soft:#123826; --warn:#f0b04a; --warn-soft:#3a2c10; --bad:#ff8c78; --bad-soft:#47211b;
  --dial:#0a1411; --dial-ink:#b9f3de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1512; --surface:#15201c; --surface2:#1a2823; --ink:#e6f0ec; --muted:#95a7a0; --line:#263731; --line2:#38504a;
  --accent:#3fcfb1; --accent-ink:#04231c; --accent-soft:#12372e;
  --elec:#f0b04a; --elec-soft:#3a2c10; --water:#64b5ee; --water-soft:#11304a;
  --ok:#5fd08b; --ok-soft:#123826; --warn:#f0b04a; --warn-soft:#3a2c10; --bad:#ff8c78; --bad-soft:#47211b;
  --dial:#0a1411; --dial-ink:#b9f3de; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
.mono,.num,.meter{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:12px} .right{text-align:right} .nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:1em;height:1em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
#app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
#side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:var(--dial);display:grid;place-items:center;color:var(--dial-ink);font-size:18px}
.brand b{display:block;font-size:14px;line-height:1.2}.brand span{font-size:11px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav:hover{background:var(--surface2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{font-size:18px}
.side-foot{margin-top:auto;padding:8px;font-size:11px;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
#top h1{font-size:18px;flex:1;min-width:120px}
.mswitch{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.mswitch select{border:0;background:none;font-weight:600;padding:5px 6px;cursor:pointer;max-width:150px}
.mswitch button{border:0;background:none;border-radius:7px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.mswitch button:hover{background:var(--surface2);color:var(--ink)}
#view{padding:20px;max-width:1280px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:90px}
#tabbar{display:none}
#menuBtn{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:34px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:12px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{padding:0;width:34px}.btn.icon.sm{width:28px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.elec{background:var(--elec-soft);color:var(--elec);border-color:transparent}.chip.water{background:var(--water-soft);color:var(--water);border-color:transparent}
input[type=text],input[type=date],input[type=search],input[type=password],input[type=number],select,textarea{width:100%;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:34px}
input:disabled,select:disabled{background:var(--surface2);color:var(--muted)}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f>input,label.f>select,label.f>textarea{color:var(--ink);font-size:14px;font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
button.kpilink{appearance:none;-webkit-appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;transition:border-color .15s,box-shadow .15s,transform .05s}
button.kpilink:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(10,108,90,.14)}
button.kpilink:active{transform:scale(.985)}
button.kpilink:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.kpilink .l::after{content:'›';margin-left:auto;font-size:18px;line-height:1;opacity:.55}
.kpi .dl{font-size:11.5px;font-weight:600}.kpi .dl.up{color:var(--ok,#0a6c5a)}.kpi .dl.dn{color:var(--bad,#b3261e)}.kpi .dl.flat{color:var(--muted)}
.seg.tabs{margin-bottom:12px}.bar.sm{height:6px}
.fnote{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 0 8px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;flex-wrap:wrap}
.banner b{color:var(--ink)}.banner .grow{flex:1;min-width:200px;color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1;min-width:160px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* meter dial inputs */
.meter{width:100%;min-width:0;background:var(--dial);color:var(--dial-ink);border:1px solid var(--dial);border-radius:7px;padding:6px 8px;font-size:15px;letter-spacing:.08em;text-align:right;min-height:34px}
.meter.old{background:transparent;color:var(--muted);border:1px dashed var(--line2)}
.meter::placeholder{color:color-mix(in srgb,var(--dial-ink) 40%,transparent)}
.meter:focus{outline:2px solid var(--accent);outline-offset:1px}
.numin{text-align:right;font-family:var(--mono)}

/* entry cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);min-width:0}
.rcard.leaving{opacity:0;transform:scale(.94);transition:opacity .28s,transform .28s}
.rcard.done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.rcard header{display:flex;align-items:center;gap:10px;min-width:0}
.rno{font-family:var(--mono);font-weight:600;font-size:15px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:2px 9px;white-space:nowrap}
.rname{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flags{display:flex;gap:4px;flex-wrap:wrap}
.mrow{display:grid;grid-template-columns:62px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;align-items:center}
.mrow .ml{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px}
.mrow.elec .ml{color:var(--elec)}.mrow.water .ml{color:var(--water)}
.mres{grid-column:2/5;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-4px}
.mres b{color:var(--ink);font-family:var(--mono)}.mres i{font-style:normal;font-family:var(--mono);color:var(--ink)}
.arrow{color:var(--muted);text-align:center}
.rcard footer{display:flex;align-items:center;gap:8px;justify-content:space-between;border-top:1px dashed var(--line2);padding-top:10px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.step button{border:0;background:var(--surface2);width:28px;height:30px;cursor:pointer;font-size:16px}
.step b{min-width:30px;text-align:center;font-family:var(--mono)}
.tot{font-family:var(--mono);font-weight:600;font-size:16px}

/* tables */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;z-index:2}
td.l,th.l{text-align:left}
td.num{font-family:var(--mono)}
tbody tr:hover td{background:var(--surface2)}
tfoot td{font-weight:700;background:var(--surface2);border-top:2px solid var(--line2);position:sticky;bottom:0}
.stk1{position:sticky;left:0;background:var(--surface);z-index:1}th.stk1{z-index:3;background:var(--surface2)}
tbody tr:hover .stk1{background:var(--surface2)}
td.e{color:var(--elec)}td.w{color:var(--water)}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* v4.3: bảng tính tháng rộng hết trang */
#view.wide{max-width:none;padding-left:14px;padding-right:14px}
.tw.fit{max-height:calc(100vh - 170px)}
.tw.fit table{font-size:clamp(11px,.82vw,13px)}
.tw.fit th,.tw.fit td{padding:6px clamp(4px,.45vw,9px)}
.tw.fit th{white-space:normal;line-height:1.2;vertical-align:bottom}
.tw.fit.h-int .c-int,.tw.fit.h-cab .c-cab,.tw.fit.h-tt .c-tt,.tw.fit.h-debt .c-debt{display:none}
.tw.fit td.l:nth-child(2){max-width:170px;overflow:hidden;text-overflow:ellipsis}

/* v4.4: người ở, tạm trú / tạm vắng */
.memrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0 0;background:var(--surface2)}
.memrow .f{margin:0}.memrow .memdel{align-self:end;justify-self:start}
.rsub{font-size:12px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tw.fit.ppl{max-height:none}
.tw.fit.ppl td.l:nth-child(2){max-width:none;overflow:visible;white-space:normal;min-width:190px}
.tw.fit.ppl th,.tw.fit.ppl td{padding:7px 8px}

/* list rows (payments, rooms) */
.lst{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lrow{display:grid;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow.head{background:var(--surface2);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);position:sticky;top:0;z-index:1}
.lrow:not(.head):hover{background:var(--surface2)}
.pay-g{grid-template-columns:70px minmax(110px,1.3fr) 110px 100px 100px 110px 120px minmax(150px,1.2fr)}
.room-g{grid-template-columns:70px minmax(130px,1.4fr) 120px 110px 100px 60px 150px 150px}
.cell-l{font-size:11px;color:var(--muted);display:none}

/* modal, toast */
.modal-root{position:fixed;inset:0;z-index:100;display:none;background:rgba(6,14,11,.55);align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal-root.open{display:flex}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:92vh}
.modal.wide{max-width:760px}
.modal>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>header h3{flex:1;font-size:16px}
.modal .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.modal>footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.fg .full{grid-column:1/-1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);max-width:90vw}
.toast.bad{background:var(--bad);color:#fff}
.sync{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.idle i{background:var(--ok)}.sync.syncing i,.sync.pending i{background:var(--warn)}.sync.error i{background:var(--bad)}.sync.needauth i{background:var(--warn)}
details.help{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface2)}
details.help summary{cursor:pointer;font-weight:600}
details.help ol{margin:8px 0 2px;padding-left:20px}details.help li{margin:4px 0}
code{font-family:var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:12px;word-break:break-all}
.copybox{display:flex;gap:6px;align-items:center}
.list-plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list-plain li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.list-plain li:last-child{border:0}
.list-plain .grow{flex:1;min-width:0}
svg.chart text{fill:var(--muted);font:10.5px var(--mono)}svg.chart .gl{stroke:var(--line)}
svg.chart .b1{fill:var(--line2)}svg.chart .b2{fill:var(--accent)}

/* notice slip (paper stays white on screen and paper) */
.noticewrap{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
.paperwrap{overflow:auto;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:14px}
.paper{background:#fff;color:#111;width:100%;max-width:640px;margin:0 auto;padding:22px 26px;border:1px solid #ccc;font:13px/1.45 'Be Vietnam Pro',system-ui,sans-serif;box-shadow:0 2px 14px rgba(0,0,0,.12)}
.paper h4{margin:0;text-align:center;font-size:17px;letter-spacing:.02em}
.paper .ph{text-align:center;font-size:12px;color:#444;margin-bottom:4px}
.paper .pm{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 2px}.paper .pm span{flex:1;min-width:140px}
.paper table{width:100%;border:1px solid #222;border-collapse:collapse;margin:8px 0;font-size:12.5px}
.paper th,.paper td{border:1px solid #222;padding:4px 7px;text-align:left;position:static;background:none;color:#111;text-transform:none;letter-spacing:0;font-size:12.5px;white-space:normal}
.paper th{font-weight:700;background:#f1f1f1;text-align:center}
.paper td.r{text-align:right;font-family:'IBM Plex Mono',monospace}.paper tr.tot td{font-weight:700}
.paper .pay{margin:6px 0;display:grid;grid-template-columns:1fr auto;gap:2px 14px}
.paper .pay b.big{font-size:15px}
.paper .payrow{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.paper .paycol{flex:1;min-width:0}
.paper .qrbox{flex:none;width:112px;text-align:center;font-size:10px;line-height:1.25;color:#333}.paper .qrbox img{display:block;width:112px;height:112px}.paper .qrbox.okq{width:auto;align-self:center;font-size:12px;font-weight:700;color:#1b7f46}
.paper .sig{display:flex;justify-content:space-around;text-align:center;margin-top:10px;min-height:70px;font-weight:600}
.paper .sig small{display:block;font-weight:400;color:#555}
.paper .foot{font-size:11.5px;font-style:italic;border-top:1px dashed #888;padding-top:6px;white-space:pre-line}
#print-root{display:none}
.fl{display:flex;gap:6px;align-items:center;font-size:12px;padding:4px 8px;border-radius:7px}.fl.warn{background:var(--warn-soft);color:var(--warn)}.fl.bad{background:var(--bad-soft);color:var(--bad)}

@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .noticewrap{grid-template-columns:1fr}
}
@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #menuBtn{display:inline-flex}
  #top{padding:8px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  #view{padding:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:96px}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  #tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:8px}
  #tabbar button svg{font-size:20px}
  #tabbar button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
  .pay-g,.room-g{grid-template-columns:1fr 1fr;gap:6px 10px}.lrow.head{display:none}
  .cell-l{display:block}
  .lrow .full{grid-column:1/-1}
  .kpi .v{font-size:20px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .fg{grid-template-columns:minmax(0,1fr)}
  #top h1{font-size:16px}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.kpi-row.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}

#print-root.per2 .paper{padding:10px 16px;font-size:11px;line-height:1.3}
#print-root.per2 .paper h4{font-size:14px}
#print-root.per2 .paper .ph{font-size:10.5px;margin-bottom:2px}
#print-root.per2 .paper .pm{margin:3px 0 0;gap:10px}
#print-root.per2 .paper p{margin:4px 0 2px!important}
#print-root.per2 .paper table{margin:4px 0}
#print-root.per2 .paper th,#print-root.per2 .paper td{padding:1px 6px;font-size:10.5px}
#print-root.per2 .paper .qrbox{width:84px;font-size:8.5px}
#print-root.per2 .paper .qrbox img{width:84px;height:84px}
#print-root.per2 .paper .sig{min-height:30px;margin-top:4px}
#print-root.per2 .paper .foot{font-size:10px;padding-top:3px}
#print-root.police{font:11px/1.4 Arial,Helvetica,sans-serif;color:#000}
#print-root.police .ph{font-size:11px;margin:0 0 6px}
#print-root.police h3{text-align:center;font-size:17px;margin:8px 0 2px;letter-spacing:.3px}
#print-root.police .sub{text-align:center;font-style:italic;margin:0 0 8px}
#print-root.police table{width:100%;border-collapse:collapse;font-size:10px}
#print-root.police th,#print-root.police td{border:1px solid #444;padding:3px 4px;text-align:left;vertical-align:top}
#print-root.police th{background:#e7e7e7;text-align:center}
#print-root.police td.c{text-align:center}
#print-root.police thead{display:table-header-group}
#print-root.police tr{page-break-inside:avoid}
#print-root.police .sigs{display:flex;justify-content:flex-end;margin-top:14px;page-break-inside:avoid}
#print-root.police .sigs>div{text-align:center;min-width:240px}
#print-root.police .sg{height:60px}
#print-root.police .brk{page-break-after:always}
@media print{
  body.printing{background:#fff}
  body.printing #app,body.printing .modal-root,body.printing #toast{display:none!important}
  body.printing #print-root{display:block}
  @page{size:A4;margin:8mm}
  #print-root .paper{box-shadow:none;border:1px solid #999;max-width:none;margin:0}
  #print-root.per2 .paper{height:136mm;overflow:hidden;margin-bottom:5mm;page-break-inside:avoid}
  #print-root.per1 .paper{page-break-after:always;font-size:15px}
}

/* v4.1: nhập theo từng dòng */
.rlist{display:flex;flex-direction:column;gap:6px}
.rhead,.rrow{display:grid;grid-template-columns:64px minmax(80px,1fr) minmax(220px,1.9fr) minmax(220px,1.9fr) 92px 112px 64px;gap:10px;align-items:center}
.rhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.rhead .r{text-align:right}
.rrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
.rrow:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rrow.done{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.rrow.leaving{opacity:0;transform:scale(.97);transition:opacity .28s,transform .28s}
.rrow .rno{justify-self:start}
.rm{display:grid;grid-template-columns:20px minmax(0,1fr) 14px minmax(0,1fr);gap:6px;align-items:center;min-width:0}
.rm .ml{display:flex;align-items:center}
.rm.elec .ml{color:var(--elec)}.rm.water .ml{color:var(--water)}
.rm .mres{grid-column:2/5;margin-top:0;font-size:11.5px}
.rrow .meter{min-height:32px;padding:4px 8px}
.rtot{text-align:right;min-width:0}
.rtot .tot{font-size:15px}
.rflags{grid-column:1/-1}.rflags:empty{display:none}
.rrow .step{justify-self:start}
.rrow .rdet{justify-self:end}
.rpeople{display:flex;align-items:center;gap:6px}
.rpeople>span{display:none}
@media (max-width:900px){
 .rhead{display:none}
 .rrow{grid-template-columns:56px minmax(0,1fr) auto;row-gap:8px}
 .rrow .rm{grid-column:1/-1}
 .rrow .rpeople{grid-column:1/3}
 .rrow .rpeople>span{display:inline}
 .rrow .rdet{grid-column:3}
}
.mgr-sec{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.mgr-sec h4{margin:0;font-size:14px}.mgr-sec p{margin:0}
.mgr-sec.dng{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.ppl-m{display:none}
@media (max-width:700px){
  .tw.ppl{display:none}.ppl-m{display:block}
  .ppl-bar>input{flex:1 1 100%;min-width:0}
  .pm-room{display:grid;grid-template-columns:62px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .pm-room.pm-flat{grid-template-columns:minmax(0,1fr)}
  .pm-id{display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:var(--surface2);border-right:1px solid var(--line);padding:6px 2px;text-align:center}
  .pm-rid{flex:none;min-width:46px;font-size:16px}
  .pm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;min-height:50px;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .pm-row:first-child{border-top:0}.pm-row:active{background:var(--surface2)}
  .pm-name{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
  .pm-rep{display:block;font-size:11px;font-weight:500;color:var(--accent);margin-top:1px}
  .pm-sub{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px}
  .pm-st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
}
.sentbox{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.sentbar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}.sentbar i{display:block;height:100%;background:var(--ok)}
.sentgrid{display:flex;flex-wrap:wrap;gap:6px}
.sentchip{display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:inherit}
.sentchip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sentchip.no{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.sentchip.cur{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#login{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
#login .box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px 24px;text-align:center}
#login img{width:72px;height:72px;border-radius:16px}
#login h1{margin:12px 0 2px;font-size:20px;color:var(--ink)}#login p{margin:0 0 16px;color:var(--muted);font-size:13px}
#login .em{font-family:var(--mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin:0 0 14px;color:var(--ink)}
#login input{width:100%;box-sizing:border-box;margin:0 0 12px;padding:10px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);color:var(--ink);font:13px var(--mono)}
#login .go{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--font);cursor:pointer}
#login .go[disabled]{opacity:.6;cursor:wait}
#login .err{margin:12px 0 0;padding:9px 10px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:13px;text-align:left}
#login .hint{margin:14px 0 0;font-size:11.5px;color:var(--muted)}
</style>

function normalizeDB(d){
  d.settings={...DEFAULT_SETTINGS,...(d.settings||{})};if(!d.settings.propertyName||d.settings.propertyName==='Nhà trọ')d.settings.propertyName=BRAND.name;if(!d.settings.address)d.settings.address=BRAND.addr;d.rooms=d.rooms||[];d.rooms.forEach(r=>{if(!Array.isArray(r.members))r.members=[]});d.months=d.months||{};d.history=d.history||[];d.rev=d.rev||1;d.deviceId=d.deviceId||uid();
  Object.values(d.months).forEach(m=>{m.recs=m.recs||{};m.payments=m.payments||{};m.deductions=m.deductions||[];m.expenses=m.expenses||[];m.reminded=m.reminded||{};m.sent=m.sent||{};m.recon=m.recon||{bank:null,cash:null};m.mainMeters=m.mainMeters||[];m.pump=m.pump||{old:0,new:null};
    m.prices=m.prices||{elec:d.settings.elecPrice,water:d.settings.waterPrice,pump:d.settings.pumpPrice,freePeople:d.settings.freePeople,extraPerson:d.settings.extraPerson}});
  return d;
}
function loadLocal(){try{const t=localStorage.getItem('tientro.db');if(t){return normalizeDB(JSON.parse(t))}}catch(e){}return null}
function persistLocal(){try{localStorage.setItem('tientro.db',JSON.stringify(DB));localOK=true}catch(e){localOK=false}}
function save(){
  DB.updatedAt=Date.now();DB.rev++;
  clearTimeout(persistTimer);persistTimer=setTimeout(persistLocal,250);
  if(Date.now()-lastSnap>3600e3){lastSnap=Date.now();snapshot('Tự động')}
  Sync.schedule();
}
async function snapshot(reason){
  try{const k='snap:'+Date.now();await idb.set(k,{t:Date.now(),reason,json:JSON.stringify(DB)});
    const ks=(await idb.keys()).filter(x=>String(x).startsWith('snap:')).sort();while(ks.length>12)await idb.del(ks.shift())}catch(e){}
}

/* ---------- Tính tiền (bám sát sheet TH) ---------- */
const sortKey=r=>{const m=/(\d+)/.exec(r.id);return [r.type==='kiot'?1:0,m?+m[1]:999,r.id]};
function sortRooms(){DB.rooms.sort((a,b)=>{const x=sortKey(a),y=sortKey(b);return x[0]-y[0]||x[1]-y[1]||(x[2]<y[2]?-1:x[2]>y[2]?1:0)})}
const roomById=id=>DB.rooms.find(r=>r.id===id);
const monthKeys=()=>Object.keys(DB.months).sort();
const monthRooms=k=>{const m=DB.months[k];return DB.rooms.filter(r=>m.recs[r.id])};
function rentAuto(room,people,m){
  if(room.rentMode==='fixed')return room.fixed||0;
  const P=m.prices,p=people||0;return p<=P.freePeople?(room.base||0):(room.base||0)+(p-P.freePeople)*P.extraPerson; // =IF(K<3,base,base+(K-2)*100000)
}
function calc(room,rec,m){
  const P=m.prices;
  const eOld=rec.eOld||0,wOld=rec.wOld||0;
  const eUse=(rec.eNew!=null&&rec.eNew>eOld)?rec.eNew-eOld:0;      // =IF(C>B,C-B,0)
  const wUse=(rec.wNew!=null&&rec.wNew>wOld)?rec.wNew-wOld:0;
  const eAmt=eUse*(rec.ePrice!=null?rec.ePrice:P.elec);
  const wAmt=wUse*(rec.wPrice!=null?rec.wPrice:P.water);          // =IF(G=0,0,G*4000)
  const rentA=rentAuto(room,rec.people,m);
  const rent=(rec.rent!=null)?rec.rent:rentA;
  const other=(rec.trash||0)+(rec.internet||0)+(rec.cable||0)+(rec.anqp||0);
  const month=eAmt+wAmt+rent+other;
  const total=month+(rec.debt||0)+(rec.tamtru||0);                // =SUM(I,J,L,M,N,O,P,Q,R)
  return {eUse,wUse,eAmt,wAmt,rent,rentA,other,month,total};
}
function paidOf(m,id){
  const l=m.payments[id]||[];let ck=0,tm=0,last='';
  l.forEach(p=>{if(p.method==='ck')ck+=p.amount;else tm+=p.amount;if(p.date&&p.date>last)last=p.date});
  return {ck,tm,total:ck+tm,last,list:l};
}
function payStatus(due,paid){
  if(due<=0&&paid<=0)return 'paid';
  if(paid>=due)return paid>due?'over':'paid';
  return paid>0?'partial':'unpaid';
}
function monthStats(k){
  const m=DB.months[k],rooms=monthRooms(k);
  const s={n:rooms.length,billed:0,paid:0,ck:0,tm:0,left:0,eUse:0,wUse:0,eAmt:0,wAmt:0,rent:0,other:0,trash:0,debt:0,tamtru:0,month:0,nPaid:0,nEntered:0,nUnpaid:0,pumpUse:0,pumpAmt:0};
  rooms.forEach(r=>{const rec=m.recs[r.id],c=calc(r,rec,m),p=paidOf(m,r.id);
    s.billed+=c.total;s.paid+=p.total;s.ck+=p.ck;s.tm+=p.tm;s.eUse+=c.eUse;s.wUse+=c.wUse;s.eAmt+=c.eAmt;s.wAmt+=c.wAmt;s.rent+=c.rent;s.other+=c.other;
    s.trash+=rec.trash||0;s.debt+=rec.debt||0;s.tamtru+=rec.tamtru||0;s.month+=c.month;
    const st=payStatus(c.total,p.total);if(st==='paid'||st==='over')s.nPaid++;else s.nUnpaid++;
    s.left+=Math.max(0,c.total-p.total);
    if(rec.eNew!=null&&rec.wNew!=null)s.nEntered++;});
  s.pumpUse=(m.pump.new!=null&&m.pump.new>(m.pump.old||0))?m.pump.new-(m.pump.old||0):0;
  s.pumpAmt=s.pumpUse*m.prices.pump;
  s.elecTotal=s.eAmt+s.pumpAmt;   // I33 + I34 (tiền điện gồm máy bơm)
  const lm=(m.mainMeters||[]).find(x=>x.id===m.lossMeter);
  s.mainUse=lm&&lm.new!=null&&lm.new>(lm.old||0)?lm.new-(lm.old||0):null;
  s.loss=s.mainUse==null?null:s.mainUse-s.eUse-s.pumpUse;
  return s;
}
const prevKey=k=>{const ks=monthKeys().filter(x=>x<k);return ks.length?ks[ks.length-1]:null};
function flagsOf(k,room){
  const m=DB.months[k],rec=m.recs[room.id],c=calc(room,rec,m),out=[];
  if(rec.eNew!=null&&rec.eNew<(rec.eOld||0))out.push({t:'bad',x:'Số điện mới nhỏ hơn số cũ'});
  if(rec.wNew!=null&&rec.wNew<(rec.wOld||0))out.push({t:'bad',x:'Số nước mới nhỏ hơn số cũ'});
  const pk=prevKey(k),pr=pk&&DB.months[pk].recs[room.id];
  if(pr){const pc=calc(room,pr,DB.months[pk]);
    if(rec.eNew!=null&&pc.eUse>0&&c.eUse>=pc.eUse*1.8&&c.eUse-pc.eUse>=40)out.push({t:'warn',x:`Điện tăng ${Math.round((c.eUse/pc.eUse-1)*100)}% so với tháng trước`});
    if(rec.eNew!=null&&c.eUse===0&&pc.eUse>0&&rec.eNew>=(rec.eOld||0))out.push({t:'warn',x:'Không dùng điện tháng này'});
    if(rec.wNew!=null&&c.wUse===0&&pc.wUse>0&&rec.wNew>=(rec.wOld||0))out.push({t:'warn',x:'Không dùng nước tháng này'});}
  return out;
}

/* ---------- Tạo tháng mới ---------- */
function lastRecBefore(roomId,k){const ks=monthKeys().filter(x=>x<k).reverse();for(const x of ks){const r=DB.months[x].recs[roomId];if(r)return r}return null}
function newRec(room,k,carryDebt){
  const pr=lastRecBefore(room.id,k);
  return {eOld:pr?(pr.eNew!=null?pr.eNew:pr.eOld):null,eNew:null,wOld:pr?(pr.wNew!=null?pr.wNew:pr.wOld):null,wNew:null,
    people:room.occupants||1,rent:null,trash:room.trash||0,internet:room.internet||0,cable:room.cable||0,anqp:room.anqp||0,debt:carryDebt||0,tamtru:0,note:''};
}
function debtFromPrev(k,roomId){
  const pk=prevKey(k);if(!pk)return 0;const pm=DB.months[pk],rec=pm.recs[roomId];if(!rec)return 0;
  const room=roomById(roomId);return Math.round(calc(room,rec,pm).total-paidOf(pm,roomId).total);
}
function createMonth(k){
  const pk=prevKey(k),pm=pk&&DB.months[pk];
  const m={recs:{},payments:{},prices:pm?{...pm.prices}:{elec:DB.settings.elecPrice,water:DB.settings.waterPrice,pump:DB.settings.pumpPrice,freePeople:DB.settings.freePeople,extraPerson:DB.settings.extraPerson},
    pump:{old:pm?(pm.pump.new!=null?pm.pump.new:pm.pump.old):0,new:null},
    mainMeters:pm?pm.mainMeters.map(x=>({...x,old:x.new!=null?x.new:x.old,new:null})):[{id:'nhatro',label:'Đồng hồ tổng nhà trọ',old:0,new:null}],
    lossMeter:pm?pm.lossMeter:'nhatro',deductions:[],expenses:[],recon:{bank:null,cash:null},locked:false,noticeDate:'',createdAt:Date.now()};
  DB.months[k]=m;
  DB.rooms.filter(r=>r.status==='occupied').forEach(r=>{m.recs[r.id]=newRec(r,k,debtFromPrev(k,r.id))});
  return m;
}
function syncRecs(k){ // phòng có khách nhưng chưa có bản ghi trong tháng
  const m=DB.months[k];if(!m||m.locked)return;let ch=false;
  DB.rooms.filter(r=>r.status==='occupied'&&!m.recs[r.id]).forEach(r=>{m.recs[r.id]=newRec(r,k,debtFromPrev(k,r.id));ch=true});
  return ch;
}

const Sync={driver:null,state:'local',msg:'',lastAt:null,timer:null,busy:false,again:false,lastCheck:0,
  schedule(){if(!this.driver||this.state==='needauth')return;clearTimeout(this.timer);setSync('pending');this.timer=setTimeout(()=>this.push(),1200)},
  flush(){if(!this.driver||this.state==='needauth'||this.busy)return;if(DB.rev>CFG.syncRev){clearTimeout(this.timer);this.push()}},
  async checkRemote(){ // quay lại tab / mỗi 60 giây: lấy dữ liệu mới nếu thiết bị khác vừa sửa
    if(!this.driver||this.busy||this.state==='needauth'||Date.now()-this.lastCheck<5000||$('#modal-root').classList.contains('open'))return;
    const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
    this.lastCheck=Date.now();
    try{const t=await this.driver.pull();const rem=t&&safeParse(t);if(!rem||rem.pid===CFG.syncPid)return;
      if(DB.rev>CFG.syncRev)showConflict(rem,'changed');else await adoptRemote(rem,'Đã cập nhật dữ liệu mới từ '+this.driver.label)}catch(e){if(e.code==='auth')setSync('needauth',e.message)}
  },
  async push(force){
    if(!this.driver)return;if(this.busy){this.again=true;return}
    this.busy=true;setSync('syncing');
    try{
      if(!force){const t=await this.driver.pull();const rem=t&&safeParse(t);
        if(rem&&rem.pid!==CFG.syncPid){this.busy=false;showConflict(rem,CFG.syncPid?'changed':'first');return}}
      const rev=DB.rev;DB.pid=uid();
      await this.driver.push(JSON.stringify(DB));
      CFG.syncPid=DB.pid;CFG.syncRev=rev;CFG.lastAt=Date.now();saveCfg();persistLocal();this.lastAt=Date.now();setSync('idle');
    }catch(e){ if(e.code==='auth')setSync('needauth',e.message);else setSync('error',e.message||String(e)) }
    this.busy=false;if(this.again){this.again=false;this.schedule()}
  },
  async startup(){
    const d=DRIVERS[CFG.driver];if(!d)return;this.driver=d;
    try{
      const ok=await d.init();if(ok!==true){setSync('needauth',ok==='needperm'?'Bấm để cấp quyền truy cập tệp':(d===FSD?'Chưa chọn tệp dữ liệu, hãy chọn lại trong Cài đặt':'Bấm để kết nối lại Google Drive'));return}
      await this.pullAndMerge();
    }catch(e){setSync(e.code==='auth'?'needauth':'error',e.message)}
  },
  async pullAndMerge(){
    setSync('syncing');const t=await this.driver.pull();
    if(!t){await this.push(true);return}
    const rem=safeParse(t);if(!rem){setSync('error','Tệp trên đám mây bị hỏng hoặc không đúng định dạng');return}
    const dirty=DB.rev>CFG.syncRev;
    if(rem.pid===CFG.syncPid){ if(dirty)await this.push(); else{this.lastAt=Date.now();setSync('idle')} return }
    if(!dirty){adoptRemote(rem,'Đã tải dữ liệu mới nhất từ '+this.driver.label);return}
    showConflict(rem,'changed');
  }
};
function setSync(state,msg){Sync.state=state;Sync.msg=msg||'';if(typeof renderSyncChips==='function')renderSyncChips()}
async function adoptRemote(rem,msg){
  await snapshot('Trước khi lấy dữ liệu từ đám mây');
  DB=normalizeDB(rem);CFG.syncPid=rem.pid;CFG.syncRev=DB.rev;saveCfg();persistLocal();Sync.lastAt=Date.now();setSync('idle');
  ensureMonthSelected();render();if(msg)toast(msg);
}

/* --- Thư mục đồng bộ trên máy (Google Drive for desktop / OneDrive) --- */
const FSD={label:'tệp trên máy',handle:null,pend:null,
  supported(){return typeof window.showSaveFilePicker==='function'},
  types:[{description:'Dữ liệu nhà trọ',accept:{'application/json':['.json']}}],
  async pick(create){
    if(create){this.handle=await window.showSaveFilePicker({suggestedName:'TienTro_data.json',types:this.types})}
    else{[this.handle]=await window.showOpenFilePicker({types:this.types})}
    await idb.set('fsHandle',this.handle);
  },
  async connect(){ if(this.pend){ if(await this.pend.requestPermission({mode:'readwrite'})!=='granted')throw new Error('Chưa được cấp quyền ghi tệp'); this.handle=this.pend;this.pend=null;return } if(!this.handle)throw new Error('Chưa chọn tệp') },
  async init(){
    const h=await idb.get('fsHandle');if(!h)return 'needauth';
    if(await h.queryPermission({mode:'readwrite'})==='granted'){this.handle=h;return true}
    this.pend=h;return 'needperm';
  },
  need(){if(!this.handle){const e=new Error(this.pend?'Bấm để cấp quyền ghi tệp':'Chưa chọn tệp dữ liệu, hãy chọn lại trong Cài đặt');e.code='auth';throw e}},
  fail(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')){this.pend=this.handle||this.pend;this.handle=null;const x=new Error('Bấm để cấp lại quyền truy cập tệp');x.code='auth';throw x}
    if(e&&e.name==='NotFoundError')throw new Error('Không tìm thấy tệp dữ liệu (đã bị xóa hoặc di chuyển). Hãy chọn lại tệp trong Cài đặt.');
    throw e},
  async pull(){this.need();try{const f=await this.handle.getFile();const t=await f.text();return t.trim()?t:null}catch(e){this.fail(e)}},
  async push(text){this.need();try{const w=await this.handle.createWritable();await w.write(text);await w.close()}catch(e){this.fail(e)}},
  async backup(text,name,auto){if(!auto)download(name,text)},
  disconnect(){this.handle=null;this.pend=null;idb.del('fsHandle')},
  nameOf(){return this.handle?this.handle.name:''}
};

/* --- Google Drive (phạm vi drive.file). Nhớ token và ID tệp giữa các lần mở, tự xin token mới khi hết hạn --- */
const GD={label:'Google Drive',token:null,exp:0,folderId:null,fileId:null,renewing:null,
  authErr(m){const e=new Error(m);e.code='auth';return e},
  loadTok(){try{const t=JSON.parse(localStorage.getItem('tientro.gd')||'null');if(t&&t.token&&Date.now()<t.exp){this.token=t.token;this.exp=t.exp}}catch(e){}},
  saveTok(){try{localStorage.setItem('tientro.gd',JSON.stringify({token:this.token,exp:this.exp}))}catch(e){}},
  valid(){return !!this.token&&Date.now()<this.exp},
  // silent=true: prompt 'none', không hiện màn hình nào; false: chỉ hỏi khi chưa từng cấp quyền
  request(silent){
    if(!CFG.gClientId)return Promise.reject(this.authErr('Chưa nhập Google Client ID'));
    return loadScript('https://accounts.google.com/gsi/client').then(()=>new Promise((res,rej)=>{
      let done=false;const fin=(f,v)=>{if(done)return;done=true;clearTimeout(to);f(v)};
      const to=setTimeout(()=>fin(rej,this.authErr('Google không phản hồi')),silent?8000:180000);
      try{
        const tc=google.accounts.oauth2.initTokenClient({client_id:CFG.gClientId.trim(),scope:'https://www.googleapis.com/auth/drive.file',
          callback:r=>{if(r.error)return fin(rej,this.authErr(r.error_description||r.error));this.token=r.access_token;this.exp=Date.now()+(r.expires_in-120)*1000;this.saveTok();fin(res)},
          error_callback:e=>fin(rej,this.authErr(e.type==='popup_closed'?'Đã đóng cửa sổ đăng nhập':(e.message||e.type||'Đăng nhập thất bại')))});
        tc.requestAccessToken({prompt:silent?'none':''});
      }catch(x){fin(rej,this.authErr(x.message||String(x)))}
    }));
  },
  async ensure(){
    if(this.valid())return;
    if(!this.renewing)this.renewing=this.request(true).finally(()=>{this.renewing=null});
    try{await this.renewing}catch(e){throw this.authErr('Cần kết nối lại Google Drive')}
  },
  async init(){this.loadTok();try{await this.ensure();return true}catch(e){return 'needauth'}},
  async connect(){await this.request(false)},
  async api(url,opt={}){
    const {ok404,...o}=opt;await this.ensure();
    const r=await fetch(url,{cache:'no-store',...o,headers:{Authorization:'Bearer '+this.token,...(o.headers||{})}});
    if(r.status===401){this.token=null;this.exp=0;try{localStorage.removeItem('tientro.gd')}catch(e){}throw this.authErr('Phiên Google đã hết hạn, hãy kết nối lại')}
    if(r.status===404&&ok404)return null;
    if(!r.ok)throw new Error('Google Drive '+r.status+': '+(await r.text()).slice(0,140));return r;
  },
  async folder(){
    if(this.folderId)return this.folderId;
    if(CFG.gFolderId)return this.folderId=CFG.gFolderId;
    const q=encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='Quản lý tiền trọ' and trashed=false");
    const j=await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)`)).json();
    if(j.files&&j.files.length)this.folderId=j.files[0].id;
    else this.folderId=(await (await this.api('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Quản lý tiền trọ',mimeType:'application/vnd.google-apps.folder'})})).json()).id;
    CFG.gFolderId=this.folderId;saveCfg();return this.folderId;
  },
  async findFile(){
    if(this.fileId)return this.fileId;
    if(CFG.gFileId){ // đã nhớ từ lần trước: còn tồn tại thì dùng luôn, khỏi tìm lại
      const r=await this.api(`https://www.googleapis.com/drive/v3/files/${CFG.gFileId}?fields=id,trashed`,{ok404:true});
      if(r){const j=await r.json();if(!j.trashed)return this.fileId=j.id}
      CFG.gFileId=null;CFG.gFolderId=null;this.folderId=null;saveCfg();
    }
    const f=await this.folder();
    const q=encodeURIComponent(`name='TienTro_data.json' and '${f}' in parents and trashed=false`);
    const j=await (await this.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id)`)).json();
    this.fileId=(j.files&&j.files[0]&&j.files[0].id)||null;
    if(this.fileId){CFG.gFileId=this.fileId;saveCfg()}
    return this.fileId;
  },
  async pull(){const id=await this.findFile();if(!id)return null;return (await this.api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text()},
  async upload(name,text,id){
    if(id){await this.api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:text});return id}
    const f=await this.folder(),b='tt'+uid();
    const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name,parents:[f],mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${text}\r\n--${b}--`;
    const r=await this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
    return (await r.json()).id;
  },
  async push(text){const id=await this.findFile();this.fileId=await this.upload('TienTro_data.json',text,id);if(CFG.gFileId!==this.fileId){CFG.gFileId=this.fileId;saveCfg()}},
  async backup(text,name){await this.upload(name,text,null)},
  disconnect(){this.token=null;this.exp=0;this.fileId=null;this.folderId=null;CFG.gFileId=null;CFG.gFolderId=null;saveCfg();try{localStorage.removeItem('tientro.gd');sessionStorage.removeItem('tientro.gd')}catch(e){}}
};

function barChart(items){
  const W=600,H=210,L=44,B=24,T=10,R=8,max=Math.max(1,...items.flatMap(x=>[x.a,x.b]));
  const step=Math.pow(10,Math.floor(Math.log10(max)));let top=Math.ceil(max/step)*step;if(top/step<3)top=Math.ceil(max/(step/2))*(step/2);
  const ticks=4,gw=(W-L-R)/items.length,bw=Math.min(26,gw/3);
  let g='';
  for(let i=0;i<=ticks;i++){const v=top*i/ticks,y=T+(H-T-B)*(1-i/ticks);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${v===0?'0':(v/1e6).toFixed(v>=1e7?0:1)+'tr'}</text>`}
  items.forEach((x,i)=>{const cx=L+gw*i+gw/2,hh=v=>(H-T-B)*v/top;
    g+=`<rect class="b1" x="${cx-bw-1}" y="${H-B-hh(x.a)}" width="${bw}" height="${Math.max(0,hh(x.a))}" rx="2"/><rect class="b2" x="${cx+1}" y="${H-B-hh(x.b)}" width="${bw}" height="${Math.max(0,hh(x.b))}" rx="2"/><text x="${cx}" y="${H-7}" text-anchor="middle">${x.label}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Biểu đồ phải thu và đã thu theo tháng">${g}</svg>`;
}

const chip=(c,t)=>`<span class="chip ${c}">${esc(t)}</span>`;

/* ---------- Nhập số ---------- */
function mIn(id,f,v,cls,dis,ph){return `<input class="meter ${cls}" inputmode="numeric" autocomplete="off" data-room="${esc(id)}" data-f="${f}" value="${v==null?'':v}" placeholder="${ph||''}" aria-label="${FLABEL[f]} phòng ${esc(id)}" ${dis}>`}
const flagsHTML=fl=>fl.map(f=>`<div class="fl ${f.t}">${icon('alert',13)}${esc(f.x)}</div>`).join('');
function entryCard(room,k){
  const m=DB.months[k],rec=m.recs[room.id],c=calc(room,rec,m),dis=m.locked?'disabled':'',done=rec.eNew!=null&&rec.wNew!=null;
  return `<article class="rcard ${done?'done':''}" data-card="${esc(room.id)}">
    <header><div class="rno">${esc(room.id)}</div><div class="rname">${esc(room.tenant.name)||'<span class="muted">Chưa có khách</span>'}</div></header>
    <div class="mrow elec"><span class="ml">${icon('bolt',14)}Điện</span>${mIn(room.id,'eOld',rec.eOld,'old',dis)}<span class="arrow">→</span>${mIn(room.id,'eNew',rec.eNew,'',dis,'số mới')}
      <div class="mres"><span><b data-out="eUse">${c.eUse}</b> kWh</span><i data-out="eAmt">${money(c.eAmt)}đ</i></div></div>
    <div class="mrow water"><span class="ml">${icon('drop',14)}Nước</span>${mIn(room.id,'wOld',rec.wOld,'old',dis)}<span class="arrow">→</span>${mIn(room.id,'wNew',rec.wNew,'',dis,'số mới')}
      <div class="mres"><span><b data-out="wUse">${c.wUse}</b> m³</span><i data-out="wAmt">${money(c.wAmt)}đ</i></div></div>
    <div data-flags class="stack" style="gap:6px">${flagsHTML(flagsOf(k,room))}</div>
    <footer><div class="step" title="Số người ở"><button data-act="ppl" data-room="${esc(room.id)}" data-d="-1" aria-label="Bớt một người" ${dis}>−</button><b data-out="people">${rec.people||0}</b><button data-act="ppl" data-room="${esc(room.id)}" data-d="1" aria-label="Thêm một người" ${dis}>+</button></div><span class="muted sm nowrap">người ở</span>
      <div class="right" style="flex:1;min-width:0"><div class="muted sm nowrap">Phòng <span class="mono" data-out="rent">${money(c.rent)}</span></div><div class="tot nowrap"><span data-out="total">${money(c.total)}</span>đ</div></div>
      <button class="btn sm" data-act="detail" data-room="${esc(room.id)}">Chi tiết</button></footer></article>`;
}

function entryRow(room,k){
  const m=DB.months[k],rec=m.recs[room.id],c=calc(room,rec,m),dis=m.locked?'disabled':'',done=rec.eNew!=null&&rec.wNew!=null;
  return `<article class="rrow ${done?'done':''}" data-card="${esc(room.id)}">
    <div class="rno">${esc(room.id)}</div><div class="rname">${esc(room.tenant.name)||'<span class="muted">Chưa có khách</span>'}</div>

      <div class="mres"><span><b data-out="eUse">${c.eUse}</b> kWh</span><i data-out="eAmt">${money(c.eAmt)}đ</i></div></div>

      <div class="mres"><span><b data-out="wUse">${c.wUse}</b> m³</span><i data-out="wAmt">${money(c.wAmt)}đ</i></div></div>
    <div class="rpeople"><div class="step" title="Số người ở"><button data-act="ppl" data-room="${esc(room.id)}" data-d="-1" aria-label="Bớt một người" ${dis}>−</button><b data-out="people">${rec.people||0}</b><button data-act="ppl" data-room="${esc(room.id)}" data-d="1" aria-label="Thêm một người" ${dis}>+</button></div><span class="muted sm nowrap">người ở</span></div>
    <div class="rtot"><div class="muted sm nowrap">Phòng <span class="mono" data-out="rent">${money(c.rent)}</span></div><div class="tot nowrap"><span data-out="total">${money(c.total)}</span>đ</div></div>

const entryMode=()=>CFG.entryView||'rows';
const entryItems=(list,k)=>entryMode()==='rows'
  ?`<div class="rlist"><div class="rhead"><span>Phòng</span><span>Khách</span><span>Điện: cũ → mới</span><span>Nước: cũ → mới</span><span>Số người</span><span class="r">Tổng thu</span><span></span></div>${list.map(r=>entryRow(r,k)).join('')}</div>`
  :list.map(r=>entryCard(r,k)).join('');
function entryHTML(k){const list=entryList(k);return list.length?entryItems(list,k):'<p class="muted">Không có phòng phù hợp.</p>'}
function entryList(k){
  const m=DB.months[k],q=UI.entryQ.trim().toLowerCase();
  return monthRooms(k).filter(r=>{
    if(q&&!(r.id.toLowerCase().includes(q)||(r.tenant.name||'').toLowerCase().includes(q)))return false;
    const rec=m.recs[r.id];if(UI.entryFilter==='todo')return rec.eNew==null||rec.wNew==null;
    if(UI.entryFilter==='flag')return flagsOf(k,r).length>0;return true;
  });
}
function vEntry(){
  const k=UI.month,m=DB.months[k];
  return `${m.locked?`<div class="banner">${icon('lock',20)}<div class="grow">Tháng này đã chốt nên không sửa được số liệu. Bấm <b>Mở khóa</b> nếu cần chỉnh.</div><button class="btn" data-act="unlock">Mở khóa</button></div>`:''}
  <div class="card"><div class="row sp"><div style="flex:1;min-width:200px"><div class="row sp"><b data-kpi="progtxt"></b><span class="muted sm">Gõ số mới rồi nhấn Enter để sang ô kế tiếp</span></div><div class="bar"><i data-kpi="progbar" style="width:0"></i></div></div>
    <div class="tools"><div class="seg" role="group" aria-label="Lọc phòng">${[['all','Tất cả'],['todo','Chưa nhập'],['flag','Cần kiểm tra']].map(([v,l])=>`<button data-act="efilter" data-v="${v}" aria-pressed="${UI.entryFilter===v}">${l}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Kiểu hiển thị">${[['rows','Dòng'],['cards','Thẻ']].map(([v,l])=>`<button data-act="eview" data-v="${v}" aria-pressed="${entryMode()===v}">${l}</button>`).join('')}</div>
    <input type="search" id="entryQ" placeholder="Tìm phòng hoặc tên" value="${esc(UI.entryQ)}" style="width:180px" aria-label="Tìm phòng"></div></div></div>
  <div class="${entryMode()==='rows'?'':'cards'}" id="cards">${entryHTML(k)}</div>`;
}
function refreshEntryHead(){
  const k=UI.month,m=DB.months[k],rooms=monthRooms(k),n=rooms.filter(r=>{const x=m.recs[r.id];return x.eNew!=null&&x.wNew!=null}).length;
  const a=$('[data-kpi="progtxt"]'),b=$('[data-kpi="progbar"]');if(a)a.textContent=`Đã nhập ${n}/${rooms.length} phòng`;if(b)b.style.width=(rooms.length?n/rooms.length*100:0)+'%';
}
function refreshCard(id){
  const k=UI.month,m=DB.months[k],room=roomById(id),rec=m.recs[id];if(!room||!rec)return;const c=calc(room,rec,m);
  const card=$(`[data-card="${CSS.escape(id)}"]`);
  if(card){const set=(o,t)=>{const e=$(`[data-out="${o}"]`,card);if(e)e.textContent=t};
    set('eUse',c.eUse);set('eAmt',money(c.eAmt)+'đ');set('wUse',c.wUse);set('wAmt',money(c.wAmt)+'đ');set('total',money(c.total));set('rent',money(c.rent));set('people',rec.people||0);
    $('[data-flags]',card).innerHTML=flagsHTML(flagsOf(k,room));card.classList.toggle('done',rec.eNew!=null&&rec.wNew!=null)}
  const dm=$(`[data-dsum="${CSS.escape(id)}"]`);
  if(dm){dm.innerHTML=`Tiền điện <b class="mono">${money(c.eAmt)}</b> · nước <b class="mono">${money(c.wAmt)}</b> · phòng <b class="mono">${money(c.rent)}</b> · khác <b class="mono">${money(c.other)}</b><br>Tổng phải thu <b class="mono" style="font-size:16px">${money(c.total)}đ</b>`;

  refreshEntryHead();
}
function detailModal(id){

      ${mi('trash','Tiền rác')}${mi('anqp','Tiền ANQP (an ninh)')}${mi('internet','Tiền internet')}${mi('cable','Tiền truyền hình cáp')}
      ${mi('debt','Nợ tháng trước (âm = trả dư)')}${mi('tamtru','Tiền giấy tạm trú / tạm vắng')}
      ${mi('ePrice','Giá điện riêng (đ/kWh)','placeholder="'+money(m.prices.elec)+'"')}${mi('wPrice','Giá nước riêng (đ/m³)','placeholder="'+money(m.prices.water)+'"')}
      <label class="f full">Ghi chú<textarea data-room="${esc(id)}" data-f="note" ${dis}>${esc(rec.note||'')}</textarea></label>

    <div class="row"><button class="btn sm" data-act="recalcdebt" data-room="${esc(id)}" ${dis}>${icon('refresh',14)}Tính lại nợ từ tháng trước</button></div>`,
    `<button class="btn primary" data-act="mclose">Xong</button>`,{onClose:()=>render()});
  refreshCard(id);

/* ---------- Bảng tính (sheet TH) ---------- */
function vTable(){
  const k=UI.month,m=DB.months[k],rooms=monthRooms(k),s=monthStats(k),dis=m.locked?'disabled':'';
  const rows=rooms.map(r=>{const rec=m.recs[r.id],c=calc(r,rec,m);
    return `<tr><td class="l stk1"><b class="mono">${esc(r.id)}</b></td><td class="l">${esc(r.tenant.name)}</td>
    <td class="num e">${rec.eOld??''}</td><td class="num e">${rec.eNew??''}</td><td class="num e">${c.eUse}</td><td class="num w">${rec.wOld??''}</td><td class="num w">${rec.wNew??''}</td><td class="num w">${c.wUse}</td>
    <td class="num">${money(c.eAmt)}</td><td class="num">${money(c.wAmt)}</td><td class="num">${rec.people||0}</td><td class="num">${money(c.rent)}</td><td class="num">${money(rec.trash)}</td><td class="num c-int">${money(rec.internet)}</td><td class="num c-cab">${money(rec.cable)}</td><td class="num">${money(rec.anqp)}</td>
    <td class="num c-debt ${rec.debt<0?'pos':rec.debt>0?'neg':''}">${money(rec.debt)}</td><td class="num c-tt">${money(rec.tamtru)}</td><td class="num"><b>${money(c.total)}</b></td>
    <td><button class="btn sm ghost" data-act="detail" data-room="${esc(r.id)}" aria-label="Sửa phòng ${esc(r.id)}">${icon('edit',14)}</button></td></tr>`}).join('');
  const sum=f=>rooms.reduce((a,r)=>a+f(m.recs[r.id]),0);

const noAccent=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^A-Za-z0-9 .,\-\/]/g,'').replace(/\s+/g,' ').trim();
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function vietQRPayload(bin,acc,amount,info){
  const f=(id,v)=>id+pad(v.length)+v;
  const bene=f('00',bin)+f('01',acc);
  let t=f('00','01')+f('01',amount>0?'12':'11')+f('38',f('00','A000000727')+f('01',bene)+f('02','QRIBFTTA'))+f('53','704');
  if(amount>0)t+=f('54',String(Math.round(amount)));
  t+=f('58','VN');if(info)t+=f('62',f('08',info));
  t+='6304';return t+crc16(t);
}
function qrContentText(k,id){
  const S=DB.settings,room=roomById(id),name=noAccent(room&&room.tenant.name);
  return noAccent((S.qrContent||'Phong {room} tien phong thang {month}').replace(/\{room\}/g,String(id).replace(/\s+/g,'')).replace(/\{month\}/g,+k.slice(5)).replace(/\{year\}/g,k.slice(0,4)).replace(/\{name\}/g,name)).slice(0,50);
}
function qrImg(text){
  if(typeof qrcode!=='function')return '';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),mg=4;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+mg} ${y+mg}h1v1h-1z`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+mg*2} ${n+mg*2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function qrBlock(k,id,amount){
  const S=DB.settings;if(S.qrOn==='0'||!S.bankBin||!S.bankAcc)return '';
  if(!(amount>0))return '<div class="qrbox okq">Đã thanh toán đủ ✓</div>';
  const src=qrImg(vietQRPayload(S.bankBin,String(S.bankAcc).replace(/\s+/g,''),amount,qrContentText(k,id)));
  return src?`<div class="qrbox"><img src="${src}" alt="Mã QR chuyển khoản">Quét mã bằng app ngân hàng.<br>Đã có sẵn số tiền ${money(amount)}đ và nội dung.</div>`:'';
}

function zaloText(k,id){

const sentAt=(m,id)=>m.sent&&m.sent[id]||'';

/* Tạo ảnh PNG của phiếu (kèm mã QR). Mã QR được đổi sang PNG trước khi chụp để luôn hiện trong ảnh. */
async function slipBlob(){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0;width:660px;background:#fff';host.innerHTML=slipHTML(UI.month,UI.noticeRoom);document.body.appendChild(host);
  try{
    for(const img of $$('img',host)){
      if(!/^data:image\/svg/.test(img.src))continue;
      await new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=600;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,600,600);x.imageSmoothingEnabled=false;x.drawImage(im,0,0,600,600);img.src=c.toDataURL('image/png')}catch(e){}res()};im.onerror=res;im.src=img.src});
      if(!img.complete)await new Promise(r=>{img.onload=img.onerror=r});
    }
    const cv=await html2canvas(host.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true});
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('Không tạo được ảnh')),'image/png'));
  }finally{host.remove()}
}
const slipName=()=>`Phieu_${UI.noticeRoom.replace(/\s+/g,'')}_${UI.month}.png`;
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}

  toast('Đang tạo ảnh phiếu…');

  }catch(e){

const normTxt=t=>noAccent(String(t||'')).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const toTitle=t=>String(t||'').trim().toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase());
function importRoomId(v){const t=normTxt(v);let m;
  if(m=/^(?:p|phong)?\s*0*(\d+)\s*h?$/.exec(t))return m[1]+' H';

function anyDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  return serialISO(typeof v==='string'?v.trim():v)||''}
const idStr=v=>{if(v==null)return '';if(typeof v==='number'){const t=String(Math.round(v));return (t.length===11||t.length===8)?'0'+t:t}return String(v).replace(/\s+/g,'').trim()};
const nameMatch=(a,b)=>{const x=normTxt(a).split(' ').filter(Boolean),y=normTxt(b).split(' ').filter(Boolean);if(!x.length||!y.length)return false;
  const [sh,lo]=x.length<=y.length?[x,y]:[y,x];return sh.every(w=>lo.includes(w))};
const lev1=(a,b)=>{if(a===b)return true;if(Math.abs(a.length-b.length)>1||Math.min(a.length,b.length)<4)return false;let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  return a.slice(i+1)===b.slice(i+1)||a.slice(i)===b.slice(i+1)||a.slice(i+1)===b.slice(i)};   // lệch tối đa 1 ký tự
const nameClose=(a,b)=>{const x=normTxt(a).split(' ').filter(Boolean),y=normTxt(b).split(' ').filter(Boolean);if(x.length<2||x.length!==y.length)return false;
  let diff=0;for(let i=0;i<x.length;i++)if(x[i]!==y[i]){if(!lev1(x[i],y[i]))return false;diff++}return diff<=1};  // gõ sai 1 chữ, ví dụ “Trung” và “Trương”
async function parsePeopleXLSX(file){

      const c={room:col(h=>h==='phong'),name:col(h=>/^ho (va )?ten$/.test(h)),dob:col(h=>h==='ngay sinh'),sex:col(h=>h==='gioi tinh'),id:col(h=>/cccd|cmnd|can cuoc/.test(h)),
        tt1:col(h=>h==='ngay dang ky'),tt2:col(h=>h==='thoi han'||h==='han tam tru'),hk:col(h=>h==='hktt'||h==='thuong tru'),note:col(h=>h==='ghi chu'),phone:col(h=>/^sdt|dien thoai/.test(h)),hkOwner:col(h=>/^chu ho/.test(h)),group:col(h=>h==='nhom ho o tro'||h==='nhom o tro'||h==='ho o tro'),ttPlace:col(h=>h==='tam tru'||h==='noi tam tru'||h==='noi dang ky tam tru')};
      if(c.room<0||c.name<0)continue;
      const rows=[];
      for(let i=hi+1;i<aoa.length;i++){const r=aoa[i],g=k=>c[k]>=0?r[c[k]]:'';const name=String(g('name')||'').trim();if(!name||!String(g('room')||'').trim())continue;
        rows.push({roomRaw:String(g('room')).trim(),room:importRoomId(g('room')),name,idNo:idStr(g('id')),dob:anyDate(g('dob')),sex:/^nam$/i.test(String(g('sex')).trim())?'Nam':/^n[ữu]$/i.test(String(g('sex')).trim())?'Nữ':'',
          tt1:anyDate(g('tt1')),tt2:anyDate(g('tt2')),hk:String(g('hk')||'').trim(),note:String(g('note')||'').trim(),phone:String(g('phone')||'').trim(),hkOwner:toTitle(g('hkOwner')),group:toTitle(g('group')),ttPlace:String(g('ttPlace')||'').trim()})}
      if(rows.length)return {sheet:sn,rows};
    }
  }
  throw new Error('Không tìm thấy bảng danh sách. File cần có hàng tiêu đề với cột “PHÒNG” và “HỌ TÊN”.');
}
const idKey=v=>String(v||'').replace(/\D/g,'').replace(/^0+/,'');
function planPeopleImport(rows){
  const byRoom={};rows.forEach(r=>(byRoom[r.room]=byRoom[r.room]||[]).push(r));
  const plan={rooms:[],skipped:[],add:0,upd:0,dup:0,total:rows.length,mism:[],repMiss:[]};
  Object.keys(byRoom).forEach(id=>{
    const room=roomById(id);
    if(!room){plan.skipped.push({id,n:byRoom[id].length,why:'chưa có phòng này trong app'});return}
    if(room.status!=='occupied'){plan.skipped.push({id,n:byRoom[id].length,why:'phòng đang để trống'});return}
    const mem=(room.members||[]),items=[];
    // Danh sách "ứng viên" đã có trong phòng: đại diện + từng người ở cùng. Người mới thêm trong lúc nhập cũng được đưa vào để dòng trùng trong file không bị thêm lần 2.
    const cands=[{t:room.tenant,tgt:'rep',id:idKey(room.tenant.idNo),name:room.tenant.name||''}]
      .concat(mem.map((m,j)=>({t:m,tgt:j,id:idKey(m.idNo),name:m.name||''})));
    byRoom[id].forEach(r=>{
      const rid=idKey(r.idNo),rn=normTxt(r.name);let c=null;
      if(rid)c=cands.find(x=>x.id===rid)||null;                       // 1. cùng CCCD là cùng một người
      if(!c){                                                          // 2. cùng tên và không mâu thuẫn CCCD
        const ok=cands.filter(x=>(!rid||!x.id)&&x.name&&(x.virt?normTxt(x.name)===rn:nameMatch(x.name,r.name)));
        c=ok.find(x=>!x.taken&&normTxt(x.name)===rn)||ok.find(x=>!x.taken)||ok.find(x=>normTxt(x.name)===rn)||null;
      }
      if(!c)c=cands.find(x=>!x.taken&&!x.virt&&(!rid||!x.id)&&x.name&&nameClose(x.name,r.name))||null;   // 3. tên gõ sai 1 chữ
      if(c&&c.virt){                                                   // dòng trùng với người vừa được thêm trong cùng lần nhập: gộp
        Object.keys(r).forEach(k=>{if(!c.item.r[k]&&r[k])c.item.r[k]=r[k]});if(rid&&!c.id)c.id=rid;
        items.push({r,target:null,kind:'dup'});plan.dup++;return;
      }
      if(c){c.taken=true;if(rid&&!c.id)c.id=rid;items.push({r,target:c.tgt,kind:'upd',old:c.name||''});plan.upd++;return}
      const item={r:{...r},target:null,kind:'add'};items.push(item);plan.add++;
      cands.push({t:null,tgt:null,id:rid,name:r.name,virt:true,taken:true,item});
    });
    if(room.tenant.name&&!cands[0].taken)plan.repMiss.push({id,name:room.tenant.name}); // đại diện không có trong file
    const newCount=items.filter(x=>x.kind==='add').length,total=1+mem.length+newCount;
    plan.rooms.push({id,room,items,newCount,total});
    if(total!==room.occupants)plan.mism.push({id,list:total,cur:room.occupants});
  });
  return plan;
}
function applyPeoplePlan(plan,opt){
  plan.rooms.forEach(({room,items,total})=>{
    room.members=room.members||[];
    items.forEach(({r,target,kind})=>{
      if(kind==='dup')return;
      if(kind==='add'){room.members.push({name:toTitle(r.name),idNo:r.idNo,tt1:r.tt1,tt2:r.tt2,tv1:'',tv2:'',dob:r.dob,sex:r.sex,hk:r.hk,hkOwner:r.hkOwner,group:r.group,ttPlace:r.ttPlace,phone:r.phone,note:r.note});return}
      if(!opt.update)return;
      const t=target==='rep'?room.tenant:room.members[target];
      if(opt.name&&r.name){const nn=toTitle(r.name);if(nn)t.name=nn}   // họ tên đầy đủ (cả đại diện và người ở cùng)
      if(!t.idNo&&r.idNo)t.idNo=r.idNo;
      ['dob','sex','hk','hkOwner','group','ttPlace','tt1','tt2'].forEach(f=>{if(r[f])t[f]=r[f]});
      if(r.phone&&!t.phone)t.phone=r.phone;
      if(r.note&&!t.note)t.note=r.note;
    });
    if(opt.occ&&total>0)room.occupants=total;
  });
}

const MERGE_F=['name','idNo','dob','sex','hk','hkOwner','group','ttPlace','phone','tt1','tt2','tv1','tv2','note'];
function findDupGroups(){
  const groups=[];
  DB.rooms.filter(r=>r.status==='occupied').forEach(room=>{
    const ps=peopleOf(room),used=new Set();
    ps.forEach((a,i)=>{
      if(used.has(i))return;const g=[a];
      ps.forEach((b,j)=>{
        if(j<=i||used.has(j))return;
        const ia=idKey(a.idNo),ib=idKey(b.idNo),na=normTxt(a.name);
        if((ia&&ib&&ia===ib)||(na&&na===normTxt(b.name)&&(!ia||!ib||ia===ib))){g.push(b);used.add(j)}
      });
      if(g.length>1){used.add(i);groups.push({room,people:g})}
    });
  });
  return groups;
}
function mergeDupGroups(gs){
  let n=0;const del=new Map();
  gs.forEach(({room,people})=>{
    const keep=people.find(p=>p.rep)||people[0],get=p=>p.rep?room.tenant:room.members[p.i],K=get(keep);
    people.filter(p=>p!==keep).forEach(p=>{
      const o=get(p);MERGE_F.forEach(f=>{if(!K[f]&&o[f])K[f]=o[f]});
      if(!p.rep){(del.get(room)||del.set(room,new Set()).get(room)).add(p.i)}n++;
    });
  });
  del.forEach((set,room)=>{room.members=room.members.filter((_,i)=>!set.has(i))});
  return n;
}

const ttState=p=>!p.tt2?'none':(dLeft(p.tt2)<0?'expired':(dLeft(p.tt2)<=RES_WARN()?'soon':'ok'));
const ttReportTxt=p=>{const s=ttState(p);return s==='expired'?'Hết hạn':s==='none'?(p.tt1?'Chưa rõ hạn':'Chưa đăng ký'):'Còn hạn'};
function policeList(o){
  const out=[];
  DB.rooms.filter(r=>r.status==='occupied').forEach(r=>peopleOf(r).forEach(p=>{
    if(!p.name&&!p.idNo)return;
    const s=ttState(p);
    if(o.scope==='valid'&&(s==='none'||s==='expired'))return;
    if(o.scope==='attn'&&s==='ok')return;
    if(o.from&&(!p.tt1||p.tt1<o.from))return;
    if(o.until&&(!p.tt1||p.tt1>o.until))return;
    out.push({r,p});
  }));
  return out;
}
function policeTV(){
  const out=[];
  DB.rooms.filter(r=>r.status==='occupied').forEach(r=>peopleOf(r).forEach(p=>{if((p.name||p.idNo)&&(p.tv1||p.tv2))out.push({r,p})}));
  return out;
}

function policePrint(o){
  const L=policeList(o),H=policeHead(o),cols=policeCols(o),T=o.tv?policeTV():[];
  const tbl=(cs,items)=>`<table><thead><tr>${cs.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${items.map((x,i)=>`<tr>${cs.map(c=>`<td class="${c.c?'c':''}">${esc(c.f(x,i))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const sign=`<div class="sigs"><div><i>Ngày ${H.d} tháng ${H.m} năm ${H.y}</i><br><b>CHỦ NHÀ TRỌ</b><br><i>(Ký, ghi rõ họ tên)</i><div class="sg"></div><b>${esc(H.mgr)}</b></div></div>`;
  const head=(title,items)=>`<div class="ph"><b>${esc((H.place||'').toUpperCase())}</b><br>Địa chỉ: ${esc(H.addr)}${H.phone?' · Điện thoại: '+esc(H.phone):''}</div><h3>${title}</h3><p class="sub">${H.to?'Kính gửi: '+esc(H.to)+' · ':''}Tính đến ngày ${H.date} · ${policeSummary(items)}</p>`;
  const root=$('#print-root');root.className='police';
  root.innerHTML=head('DANH SÁCH NGƯỜI Ở TRỌ / TẠM TRÚ',L)+tbl(cols,L)+sign+(T.length?`<div class="brk"></div>`+head('DANH SÁCH NGƯỜI TẠM VẮNG',T)+tbl(policeTVCols(),T)+sign:'');
  const st=document.createElement('style');st.id='policePage';st.textContent='@page{size:A4 landscape;margin:10mm}';document.head.appendChild(st);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');root.innerHTML='';root.className='';st.remove();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);setTimeout(()=>window.print(),80);
}
function policeModal(){

  const warn=[['chưa có CCCD',miss(p=>p.idNo)],['chưa có ngày sinh',miss(p=>p.dob)],['chưa có nơi thường trú (HKTT)',miss(p=>p.hk)],['chưa có hạn tạm trú',miss(p=>p.tt2)]].filter(x=>x[1]);
  openModal('Báo cáo gửi công an',`
    <p class="muted" style="margin:0 0 10px">Danh sách người ở trọ / tạm trú gồm họ tên, ngày sinh, giới tính, CCCD, nơi thường trú, ngày đăng ký và hạn tạm trú, theo từng phòng. Có sẵn khung ký tên chủ nhà trọ.</p>
    <div class="fg">
      <label class="f full">Kính gửi (cơ quan nhận)<input type="text" id="prTo" value="${esc(CFG.policeTo||'')}" placeholder="vd: Công an phường An Phú"></label>
      <label class="f">Người ký (chủ nhà trọ)<input type="text" id="prSign" value="${esc(CFG.policeSign||S.manager||'')}"></label>
      <label class="f">Phạm vi<select id="prScope"><option value="all">Tất cả người đang ở</option><option value="valid">Chỉ người còn hạn tạm trú</option><option value="attn">Chỉ người cần xử lý (hết hạn / sắp hết / chưa có hạn)</option></select></label>
      <label class="f">Đăng ký tạm trú từ ngày<input type="date" id="prFrom"></label><label class="f">đến ngày<input type="date" id="prUntil"></label>
    </div>
    <div class="mgr-sec" style="margin-top:10px"><label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="prNote"><span>Thêm cột Ghi chú (ghi chú nội bộ trong app)</span></label>
      <label class="row" style="gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="prTv" ${nT?'checked':''} ${nT?'':'disabled'}><span>Kèm danh sách tạm vắng (${nT} người)</span></label></div>
    <p id="prCount" style="margin:8px 0 0"></p>
    ${warn.length?`<div class="fl warn" style="margin-top:8px">${icon('alert',13)}Còn thiếu thông tin: ${esc(warn.map(x=>x[1]+' người '+x[0]).join(' · '))}. Bổ sung ở nút sửa (bút chì) hoặc nhập lại file Excel trước khi gửi.</div>`:''}`,
    `<button class="btn" data-act="mclose">Đóng</button><button class="btn" id="prPrint">In / lưu PDF</button><button class="btn primary" id="prXlsx">${icon('down',14)}Tải file Excel</button>`,{wide:true});
  const opts=()=>{const o={to:$('#prTo').value,sign:$('#prSign').value,scope:$('#prScope').value,from:$('#prFrom').value,until:$('#prUntil').value,note:$('#prNote').checked,tv:$('#prTv').checked};CFG.policeTo=o.to.trim();CFG.policeSign=o.sign.trim();saveCfg();return o};
  const upd=()=>{const L=policeList({scope:$('#prScope').value,from:$('#prFrom').value,until:$('#prUntil').value});$('#prCount').innerHTML=`Báo cáo sẽ gồm <b>${L.length}</b> người (${new Set(L.map(x=>x.r.id)).size} phòng) trên tổng số ${all.length} người đang ở.`};
  ['prScope','prFrom','prUntil'].forEach(i=>$('#'+i).addEventListener('input',upd));upd();
  $('#prXlsx').onclick=()=>{const o=opts();if(!policeList(o).length)return toast('Không có ai phù hợp bộ lọc','bad');policeXLSX(o)};
  $('#prPrint').onclick=()=>{const o=opts();if(!policeList(o).length)return toast('Không có ai phù hợp bộ lọc','bad');closeModal(true);policePrint(o)};
}
/* ---------- Người chuyển đi (ghi nhận từng người khi trả phòng) ---------- */
function leaveAll(){ // trải lịch sử trả phòng thành danh sách từng người; bản ghi cũ chỉ có tên thì dựng từ tên đại diện + người ở cùng
  const out=[];
  (DB.history||[]).forEach(h=>{
    const ppl=Array.isArray(h.people)&&h.people.length?h.people:[{rep:true,name:h.name||''},...(h.members||[]).map(n=>({rep:false,name:n}))].filter(p=>p.name);
    ppl.forEach(p=>out.push({h,p}));
  });
  return out.sort((a,b)=>(b.h.moveOut||'').localeCompare(a.h.moveOut||'')||String(a.h.roomId).localeCompare(String(b.h.roomId),'vi',{numeric:true})||(b.p.rep?1:0)-(a.p.rep?1:0));
}
function leaveFiltered(){
  const all=leaveAll(),q=normTxt(UI.leaveQ||''),mo=UI.leaveMonth||'all';
  return all.filter(({h,p})=>(mo==='all'||(h.moveOut||'').slice(0,7)===mo)&&(!q||normTxt([h.roomId,p.name,p.idNo,p.phone].join(' ')).includes(q)));
}
function leaveRowsHTML(list){
  return list.map(({h,p})=>`<tr><td>${fmtDate(h.moveOut)||'–'}</td><td class="l"><b class="mono">${esc(h.roomId)}</b></td><td class="l"><b>${esc(p.name)||'<span class="muted">(chưa nhập tên)</span>'}</b> ${p.rep?chip('acc','Đại diện'):''}${(p.dob||p.sex)?`<div class="muted sm">${esc([p.dob?'sinh '+fmtDate(p.dob):'',p.sex].filter(Boolean).join(' · '))}</div>`:''}</td>
    <td class="num">${esc(p.idNo)||'–'}</td><td>${p.rep?(fmtDate(h.moveIn)||'–'):'<span class="muted">–</span>'}</td><td>${p.tt1||p.tt2?`${fmtDate(p.tt1)||'…'} → ${fmtDate(p.tt2)||'…'}`:'–'}</td><td class="l">${esc(p.phone||'')}</td><td class="l">${p.rep?esc(h.note||''):''}</td></tr>`).join('')||'<tr><td class="l muted" colspan="8">Chưa có ai chuyển đi.</td></tr>';
}
function leaveSummary(list){const rooms=new Set(list.map(x=>x.h.roomId)).size;return `${list.length} người · ${rooms} phòng`}
function vLeave(){
  const all=leaveAll(),months=[...new Set(DB.history.map(h=>(h.moveOut||'').slice(0,7)).filter(Boolean))].sort().reverse(),list=leaveFiltered();
  if(UI.leaveMonth!=='all'&&!months.includes(UI.leaveMonth))UI.leaveMonth='all';
  return `<div class="tools"><span class="muted grow" id="leaveSum">${leaveSummary(list)}${all.length!==list.length?` (trên tổng ${all.length} người đã chuyển đi)`:''}</span>
    <select data-change="leavemonth" aria-label="Lọc theo tháng" style="width:auto"><option value="all">Tất cả các tháng</option>${months.map(m=>`<option value="${m}" ${m===UI.leaveMonth?'selected':''}>Tháng ${m.slice(5)}/${m.slice(0,4)}</option>`).join('')}</select>
    <input type="search" id="leaveQ" placeholder="Tìm phòng, tên, CCCD" value="${esc(UI.leaveQ||'')}" aria-label="Tìm người chuyển đi">
    <button class="btn" data-act="leavexlsx" ${all.length?'':'disabled'}>${icon('down',16)}Tải file Excel</button></div>
  <div class="tw fit ppl"><table><thead><tr><th>Ngày chuyển đi</th><th class="l">Phòng</th><th class="l">Họ và tên</th><th>CMND/CCCD</th><th>Ngày thuê</th><th>Tạm trú (từ → đến)</th><th class="l">Điện thoại</th><th class="l">Ghi chú</th></tr></thead>
  <tbody id="leaveBody">${leaveRowsHTML(list)}</tbody></table></div>
  <p class="muted sm" style="margin:0">Khi bấm <b>Trả phòng</b> ở mục Phòng &amp; khách, tất cả người đang ở phòng đó (đại diện và người ở cùng) tự động được ghi vào danh sách này. Nhớ báo xóa tạm trú cho những người đã chuyển đi. Bản ghi trả phòng cũ (trước v5.3) chỉ có tên, không có CCCD.</p>`;
}
async function leaveXLSX(){
  try{await ensureXLSX()}catch(e){return toast('Chưa tải được thư viện Excel (cần Internet).','bad')}
  const L=leaveFiltered();if(!L.length)return toast('Không có ai để xuất','bad');
  const rows=[['Ngày chuyển đi','Số phòng','Họ và tên','Vai trò','CMND/CCCD','Ngày sinh','Giới tính','Ngày thuê','Tạm trú từ','Tạm trú đến','Điện thoại','HKTT','Ghi chú']];
  L.forEach(({h,p})=>rows.push([fmtDate(h.moveOut),h.roomId,p.name||'',p.rep?'Đại diện':'Ở cùng',p.idNo||'',p.dob?fmtDate(p.dob):'',p.sex||'',p.rep?fmtDate(h.moveIn):'',p.tt1?fmtDate(p.tt1):'',p.tt2?fmtDate(p.tt2):'',p.phone||'',p.hk||'',p.rep?(h.note||''):'']));
  const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[13,9,24,10,16,12,9,12,12,12,14,28,24].map(w=>({wch:w}));
  rows.forEach((r,i)=>{if(i)[4].forEach(c=>{const a=XLSX.utils.encode_cell({r:i,c});if(ws[a])ws[a]={t:'s',v:String(ws[a].v)}})}); // giữ CCCD dạng chữ, không mất số 0 đầu
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Nguoi chuyen di');XLSX.writeFile(wb,`Nguoi_chuyen_di_${todayISO()}.xlsx`);toast('Đã xuất file Excel');
}

function vReportMain(){
  const ks=monthKeys(),stats=ks.map(k=>({k,s:monthStats(k)})).reverse();
  if(!UI.reportRoom||!roomById(UI.reportRoom))UI.reportRoom=DB.rooms[0]&&DB.rooms[0].id;
  const rid=UI.reportRoom;
  const hist=ks.slice().reverse().map(k=>{const m=DB.months[k],rec=m.recs[rid];if(!rec)return '';const c=calc(roomById(rid),rec,m),p=paidOf(m,rid);
    return `<tr><td class="l">${monthLabel(k)}</td><td class="num e">${rec.eOld??''} → ${rec.eNew??''}</td><td class="num e">${c.eUse}</td><td class="num w">${c.wUse}</td><td class="num">${money(c.eAmt)}</td><td class="num">${money(c.wAmt)}</td><td class="num">${money(c.total)}</td><td class="num">${money(p.total)}</td><td class="num ${c.total-p.total>0?'neg':''}">${money(c.total-p.total)}</td></tr>`}).join('');
  const ch=stats.slice(0,8).reverse().map(x=>({label:x.k.slice(5)+'/'+x.k.slice(2,4),a:x.s.billed,b:Math.min(x.s.paid,x.s.billed)}));

let modalClose=null;

function openModal(title,body,footer,opt={}){

  root.classList.add('open');const f=$('input:not([disabled]):not([type=hidden]),select',root);if(f&&!/Mobi|Android/i.test(navigator.userAgent))f.focus();
}
function closeModal(skip){const root=$('#modal-root');root.classList.remove('open');root.innerHTML='';const cb=modalClose;modalClose=null;if(cb&&!skip)cb()}
function confirmBox(title,msg,okLabel,cb,danger=true){
