async function syncDiag(){
  const o=$('#diagout');if(!o)return;o.textContent='Đang kiểm tra…';
  const L=[],add=(k,v)=>L.push(k+': '+v),fmt=t=>t?new Date(t).toLocaleString('vi-VN'):'-',sh=x=>(x||'').slice(0,6)||'-';
  add('Phiên bản','v5.4');add('Địa chỉ app',location.origin+location.pathname);
  add('Nơi lưu',CFG.driver||'(chưa kết nối)');add('Trạng thái',Sync.state+(Sync.msg?' – '+Sync.msg:''));
  add('Máy này: rev',DB.rev+' · rev đã đồng bộ '+CFG.syncRev);add('Máy này: pid',sh(DB.pid)+' · pid đã đồng bộ '+sh(CFG.syncPid));
  add('Máy này: sửa lần cuối',fmt(DB.updatedAt)+' · '+Object.keys(DB.months).length+' tháng · '+peopleCount(DB)+' người ở');
  if(CFG.driver==='gdrive'){
    add('Token Google',GD.valid()?('còn '+Math.round((GD.exp-Date.now())/60000)+' phút'):'hết hạn hoặc chưa có');
    add('Client ID',(CFG.gClientId||'').slice(0,14)+'…');
    try{
      const q=encodeURIComponent("name='TienTro_data.json' and trashed=false");
      const j=await (await GD.api(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime&fields=files(id,createdTime,modifiedTime,size)`)).json();
      const fl=j.files||[];add('Số tệp TienTro_data.json thấy được',fl.length+(fl.length>1?'  ← BỊ TRÙNG':''));
      fl.forEach((f,i)=>add('  tệp '+(i+1),f.id.slice(0,8)+'… sửa '+fmt(f.modifiedTime)+' · '+f.size+' byte'));
      add('Tệp máy này đang dùng',(CFG.gFileId||'').slice(0,8)+'…');
      const t=await GD.pull(),rem=t&&safeParse(t);
      if(rem)add('Trên Drive',`rev ${rem.rev} · pid ${sh(rem.pid)} · sửa ${fmt(rem.updatedAt)} · ${Object.keys(rem.months||{}).length} tháng · ${peopleCount(rem)} người ở`);else add('Trên Drive','trống hoặc không đọc được');
      if(rem)add('Kết luận',rem.pid===CFG.syncPid?'Máy này ĐÃ khớp với Drive':'Máy này KHÁC Drive (bấm "Đồng bộ ngay")');
    }catch(e){add('LỖI',e.message||String(e))}
  }
  o.textContent=L.join('\n');
}
async function connectDriver(kind){
  const d=DRIVERS[kind];
  try{
    setSync('syncing','Đang kết nối…');await d.connect();
    Sync.driver=d;CFG.driver=kind;CFG.syncPid=null;saveCfg();
    const t=await d.pull();
    if(!t){await Sync.push(true);toast('Đã tạo tệp dữ liệu trên '+d.label)}
    else{const rem=safeParse(t);if(!rem)throw new Error('Tệp đã chọn không phải dữ liệu của ứng dụng');setSync('idle');showConflict(rem,'first')}
  }catch(e){
    if(!CFG.driver||CFG.driver!==kind){Sync.driver=null;CFG.driver=null;saveCfg();setSync('local')}else setSync('error',e.message);
    if(e&&e.name!=='AbortError')toast(e.message||String(e),'bad');
  }
  render();
}
async function reauth(quiet){
  if(Sync.driver===FSD&&!FSD.pend&&!FSD.handle){if(quiet)return;UI.view='settings';await loadSnaps();render();return toast('Hãy chọn lại tệp dữ liệu ở mục Nơi lưu dữ liệu','bad')}
  try{await Sync.driver.connect();await Sync.pullAndMerge()}catch(e){setSync(e.code==='auth'?'needauth':'error',e.message);if(!quiet)toast(e.message,'bad')}
}

  const C={acc:'FF0A6C5A',soft:'FFD9EFE8',line:'FFB9C6C0',tot:'FFEDF1EF',zebra:'FFF7FAF8',white:'FFFFFFFF',ink:'FF10201B',muted:'FF566660'};

const isoAdd=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const dueISO=k=>`${k}-${pad(Math.min(DB.settings.dueDay||5,28))}`;
function remindOffsets(){const t=String(DB.settings.remindOffsets==null?'-2,1,5':DB.settings.remindOffsets);const a=t.split(/[,;\s]+/).filter(Boolean).map(Number).filter(x=>Number.isFinite(x));return a.length?a.sort((x,y)=>x-y):[]}
function remindSched(k){const due=dueISO(k),t=todayISO();const ds=remindOffsets().map(o=>isoAdd(due,o)).filter(d=>d<=t);return ds.length?ds[ds.length-1]:null}
function pendingRemind(k){
  const sc=remindSched(k),m=DB.months[k];if(!sc||!m)return [];
  return remindList(null).filter(x=>(m.reminded&&m.reminded[x.r.id]||'')<sc);
}
function startRemindQueue(all){

  if(!all){const p=pendingRemind(k);if(p.length)L=p}
  if(!L.length)return toast('Không có phòng nào còn thiếu tiền');

function remindStep(){

/* ---------- Thống kê trả trễ ---------- */
function lateStats(){
  const today=todayISO(),ks=monthKeys(),res={};
  DB.rooms.forEach(r=>{res[r.id]={r,months:0,ontime:0,late:0,lateDays:0,unpaid:0,unknown:0}});
  ks.forEach(k=>{const m=DB.months[k],due=dueISO(k);
    monthRooms(k).forEach(r=>{const rec=m.recs[r.id],c=calc(r,rec,m),o=res[r.id];if(!o||!(c.total>0))return;
      const pays=(m.payments[r.id]||[]).slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
      let cum=0,full=null;for(const x of pays){cum+=x.amount;if(cum>=c.total){full=x.date||'';break}}
      if(full===null){if(today<=due)return;o.months++;o.unpaid++;return}
      o.months++;if(full===''){o.unknown++;return}
      const dl=daysBetween(due,full);if(dl<=0)o.ontime++;else{o.late++;o.lateDays+=dl}
    })});
  const lk=ks[ks.length-1],lm=lk&&DB.months[lk];
  return Object.values(res).filter(o=>o.months>0).map(o=>{
    const known=o.months-o.unknown,bad=o.late+o.unpaid,rate=known>0?o.ontime/known:null;
    let left=0;if(lm&&lm.recs[o.r.id]){const c=calc(o.r,lm.recs[o.r.id],lm);left=Math.max(0,Math.round(c.total-paidOf(lm,o.r.id).total))}
    const lv=known<2?['','Ít dữ liệu']:(bad/known>=.5?['bad','Hay trễ']:(bad/known>=.25?['warn','Thỉnh thoảng trễ']:['ok','Đúng hạn']));
    return {...o,known,bad,rate,left,lv,avg:o.late?Math.round(o.lateDays/o.late):0};
  }).sort((a,b)=>b.bad-a.bad||b.lateDays-a.lateDays||b.left-a.left);
}

  return `<div class="grid g4 kpi-row">

    <div class="card kpi"><span class="l">Tỷ lệ đúng hạn toàn nhà</span><span class="v">${tk?Math.round(to/tk*100):0}%</span><span class="s">${to}/${tk} lượt tháng-phòng</span></div>
    <div class="card kpi"><span class="l">Trễ trung bình</span><span class="v">${tl?Math.round(td/tl):0}<small class="sm muted"> ngày</small></span><span class="s">${tl} lượt trả trễ</span></div>
    <div class="card kpi"><span class="l">Đang nợ tháng gần nhất</span><span class="v ${L.some(o=>o.left>0)?'neg':''}">${money(L.reduce((a,o)=>a+o.left,0))}</span><span class="s">${L.filter(o=>o.left>0).length} phòng</span></div></div>
  <div class="card"><h2>Phòng theo mức độ trả trễ</h2><div class="tw"><table><thead><tr><th class="l">Phòng</th><th class="l">Tên</th><th>Số tháng</th><th>Đúng hạn</th><th>Trễ</th><th>Chưa đủ</th><th>% đúng hạn</th><th>Đang nợ</th><th class="l">Đánh giá</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="muted sm" style="margin:10px 0 0">Cách tính: “đúng hạn” là ngày khoản thu đủ tổng phải thu, không muộn hơn hạn thu (ngày ${DB.settings.dueDay||5} hằng tháng). “Trễ” là đủ nhưng sau hạn. “Chưa đủ” là tháng đã quá hạn mà chưa thu đủ. Khoản thu không ghi ngày trả không bị tính trễ. Nợ cộng dồn từ tháng trước làm tháng sau cũng bị tính chưa đủ nếu chưa trả hết.</p></div>`;
}

    const lim=136*96/25.4;root.style.cssText='display:block;position:absolute;left:0;top:0;width:194mm;visibility:hidden';

/* Ở bộ lọc "Chưa nhập": phòng nhập đủ điện + nước và đã rời ô nhập thì tự biến mất, bộ đếm tăng lên */
let _downCard=null,_downAt=0;
document.addEventListener('pointerdown',e=>{const c=e.target.closest&&e.target.closest('[data-card]');_downCard=c;_downAt=Date.now()},true);
function pruneDone(){
  if(UI.view!=='entry'||UI.entryFilter!=='todo')return;
  const box=$('#cards');if(!box)return;const act=document.activeElement;
  $$('.rcard.done:not(.leaving),.rrow.done:not(.leaving)',box).forEach(c=>{
    if(act&&c.contains(act))return;
    if(_downCard===c&&Date.now()-_downAt<1200){setTimeout(pruneDone,1250-(Date.now()-_downAt));return}
    c.classList.add('leaving');
    setTimeout(()=>{c.remove();refreshEntryHead();if(!$('.rcard,.rrow',box))box.innerHTML='<p class="muted">Đã nhập đủ số điện nước cho tất cả phòng.</p>'},300);
  });
}
const prunePoll=()=>setTimeout(pruneDone,60);

/* ---------- sự kiện ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.room&&t.dataset.f){setField(t.dataset.room,t.dataset.f,t.value);refreshCard(t.dataset.room);scheduleSave();return}
  if(t.id==='entryQ'){UI.entryQ=t.value;$('#cards').innerHTML=entryHTML(UI.month);refreshEntryHead()}
  if(t.id==='payQ'){UI.payQ=t.value;$('#payList').innerHTML=payListOnly()}
  if(t.id==='pplQ'){UI.peopleQ=t.value;const d=pplData();$('#pplRows').innerHTML=pplRowsHTML(d.list);$('#pplMob').innerHTML=pplMobHTML(d.list,d.so==='room');$('#pplSum').textContent=pplSummary(d)}
  if(t.id==='leaveQ'){UI.leaveQ=t.value;const l=leaveFiltered();$('#leaveBody').innerHTML=leaveRowsHTML(l);$('#leaveSum').textContent=leaveSummary(l)}
});
let saveT=null;function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;save()},400)}
function flushAll(){if(saveT){clearTimeout(saveT);saveT=null;save()}clearTimeout(persistTimer);persistLocal();Sync.flush()}
function payListOnly(){const d=document.createElement('div');d.innerHTML=vPay();return $('#payList',d).innerHTML}
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('meter')&&!t.classList.contains('old')){const v0=t.value;setTimeout(()=>{if(document.activeElement===t&&t.value===v0){try{t.select()}catch(x){}}},0)}});
document.addEventListener('focusout',e=>{
  const t=e.target;prunePoll();
  if(t.dataset&&t.dataset.money&&t.tagName==='INPUT'&&!t.dataset.set&&!t.dataset.m){const v=parseInt0(t.value);t.value=v==null?'':money(v)}
});
document.addEventListener('change',e=>{
  const t=e.target,c=t.dataset.change;
  if(t.dataset.set){const k=t.dataset.set;const v=t.dataset.t==='n'?(parseInt0(t.value)||0):t.value;DB.settings[k]=v;if(k==='bankBin'){const b=BANKS.find(x=>x.bin===v);if(b&&!DB.settings.bankName)DB.settings.bankName=b.name}if(t.dataset.t==='n')t.value=money(v);save();if(k==='bankBin'||k==='qrOn'||k==='qrContent')render();if(k==='propertyName')renderChrome();return}
  if(t.dataset.m&&!t.dataset.room){const m=DB.months[UI.month];if(m.locked&&!/^recon\./.test(t.dataset.m))return;const isNum=t.dataset.money||t.classList.contains('meter');
    const v=t.type==='date'||t.type==='month'?t.value:parseInt0(t.value);
    const path=t.dataset.m;if(/^pump\.|mainMeters\.|^recon\./.test(path)||!isNum)setPath(m,path,v);else setPath(m,path,v==null?0:v);save();render();return}
  if(c==='msel')setMonth(t.value);
  else if(c==='noticedate'){UI.noticeDate=t.value||null;render()}
  else if(c==='noticeroom'){UI.noticeRoom=t.value;render()}
  else if(c==='peoplesort'){UI.peopleSort=t.value;render()}
  else if(c==='leavemonth'){UI.leaveMonth=t.value;render()}
  else if(c==='reproom'){UI.reportRoom=t.value;render()}
  else if(c==='lossmeter'){DB.months[UI.month].lossMeter=t.dataset.v;save();render()}
  else if(t.id==='fileJson'&&t.files[0]){importJSON(t.files[0]);t.value=''}
  else if(t.id==='fileXlsx'&&t.files[0]){importXLSX(t.files[0]);t.value=''}
  else if(t.id==='filePeople'&&t.files[0]){importPeopleXLSX(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#modal-root').classList.contains('open'))closeModal();
  const t=e.target;
  if(e.key==='Enter'&&t.dataset&&(t.dataset.f==='eNew'||t.dataset.f==='wNew')){e.preventDefault();
    const all=$$('[data-f="eNew"],[data-f="wNew"]').filter(x=>!x.disabled),i=all.indexOf(t);const n=all[i+1];if(n){n.focus();n.select()}else{t.blur()}prunePoll()}
});
$('#modal-root').addEventListener('mousedown',e=>{if(e.target.id==='modal-root')closeModal()});

function debtOf(id){const k=UI.month,m=DB.months[k];if(!m.recs[id])return 0;return Math.round(calc(roomById(id),m.recs[id],m).total-paidOf(m,id).total)}
function moveOutModal(id){

  openModal(`Trả phòng ${id} · ${r.tenant.name}`,`<div class="fg"><label class="f">Ngày trả phòng<input id="mdate" type="date" value="${todayISO()}"></label>
    <label class="f">Hoàn lại tiền cọc<input id="mrefund" type="text" inputmode="numeric" class="numin" data-money="1" value="${money(Math.max(0,dep-owed))}"></label>
    <div class="full sm muted">Tiền cọc ${money(dep)}đ − còn nợ ${money(owed)}đ (${monthLabel(UI.month).toLowerCase()}) = ${money(dep-owed)}đ. Chỉnh lại số hoàn cọc nếu cần.</div>
    <div class="full"><div class="sm"><b>${ppl.length} người sẽ được ghi vào danh sách chuyển đi:</b></div><div class="sm muted">${ppl.map(p=>esc(p.name||p.idNo)+(p.rep?' (đại diện)':'')).join(' · ')||'Chưa có tên người ở'}</div></div>
    <label class="f full">Ghi chú<textarea id="mnote"></textarea></label></div><p class="muted sm" style="margin:0">Phòng chuyển sang “Trống” và không tính tiền từ tháng tạo sau. Số liệu các tháng cũ được giữ nguyên.</p>`,
    `<button class="btn" data-act="mclose">Hủy</button><button class="btn primary" data-act="moveoutsave" data-room="${esc(id)}">Xác nhận trả phòng</button>`);
}
function saveRoom(oldId){
  const isNew=!oldId,id=isNew?$('#rid').value.trim().replace(/\s+/g,' ').toUpperCase():oldId;
  if(!id)return toast('Hãy nhập số phòng','bad');if(isNew&&roomById(id))return toast('Số phòng này đã tồn tại','bad');
  const g=i=>parseInt0($('#'+i).value)||0;
  const r=isNew?{id,tenant:{}}:roomById(id);
  Object.assign(r,{type:$('#rtype').value,rentMode:$('#rmode').value,base:g('rbase'),fixed:g('rfixed'),trash:g('rtrash'),anqp:g('ranqp'),internet:g('rnet'),cable:g('rcable'),occupants:Math.max(0,g('rocc')),status:$('#rstatus').value});
  r.tenant=Object.assign({},r.tenant,{name:$('#tname').value.trim(),phone:$('#tphone').value.trim(),idNo:$('#tid').value.trim(),moveIn:$('#tdate').value,deposit:g('tdep'),note:$('#tnote').value.trim(),tt1:$('#ttf').value,tt2:$('#ttt').value,tv1:$('#tvf').value,tv2:$('#tvt').value,dob:$('#tdob').value,sex:$('#tsex').value,hk:$('#thk').value.trim(),hkOwner:$('#thko').value.trim(),group:$('#tgrp').value.trim(),ttPlace:$('#ttpl').value.trim()});
  r.members=$$('#memRows .memrow').map(row=>({name:$('.m-name',row).value.trim(),idNo:$('.m-id',row).value.trim(),tt1:$('.m-tt1',row).value,tt2:$('.m-tt2',row).value,tv1:$('.m-tv1',row).value,tv2:$('.m-tv2',row).value,dob:$('.m-dob',row).value,sex:$('.m-sex',row).value,hk:$('.m-hk',row).value.trim(),hkOwner:$('.m-hko',row).value.trim(),group:$('.m-grp',row).value.trim(),phone:$('.m-ph',row).value.trim(),ttPlace:$('.m-tpl',row).value.trim(),note:$('.m-note',row).value.trim()})).filter(x=>x.name||x.idNo||x.tt1||x.tt2||x.tv1||x.tv2);
  const nPeople=1+r.members.length;
  if(isNew)DB.rooms.push(r);sortRooms();syncRecs(UI.month);save();closeModal(true);render();toast(isNew?'Đã thêm phòng '+id:'Đã lưu phòng '+id);
  if(r.members.length&&nPeople!==r.occupants)setTimeout(()=>toast(`Lưu ý: danh sách ghi ${nPeople} người nhưng “Số người ở mặc định” là ${r.occupants}. Chỉnh nếu cần tính phụ thu.`),600);
}

function monthMgrModal(){
  const k=UI.month,m=DB.months[k],ks=monthKeys(),pk=prevKey(k);
  const nPay=Object.values(m.payments||{}).reduce((a,l)=>a+(l||[]).length,0),nIn=Object.values(m.recs||{}).filter(r=>r.eNew!=null||r.wNew!=null).length;
  openModal('Sửa / xóa '+monthLabel(k).toLowerCase(),`
    <p class="muted" style="margin:0 0 12px">Tháng này có <b>${Object.keys(m.recs).length}</b> phòng, đã nhập số cho <b>${nIn}</b> phòng, <b>${nPay}</b> lần thu tiền${m.locked?', <b>đã chốt</b>':''}.</p>
    <div class="mgr-sec"><h4>1. Đổi sang tháng khác</h4><p class="muted sm">Dùng khi tạo nhầm tháng (ví dụ lẽ ra là 11 nhưng lại tạo 12). Toàn bộ số liệu giữ nguyên, chỉ đổi tên tháng.</p>
      <div class="row" style="gap:8px"><input type="month" id="mmk" value="${k}" style="flex:1"><button class="btn primary" id="mmRen">Đổi tháng</button></div></div>
    <div class="mgr-sec"><h4>2. Làm lại tháng này từ đầu</h4><p class="muted sm">${pk?`Xóa mọi số đã nhập và tiền đã thu của tháng này, rồi tạo lại từ ${monthLabel(pk).toLowerCase()} (số cũ, nợ, đơn giá cập nhật lại).`:'Không có tháng trước để lấy số cũ.'}</p>
      <div><button class="btn danger" id="mmReset" ${pk?'':'disabled'}>${icon('refresh',14)}Làm lại tháng này</button></div></div>
    <div class="mgr-sec dng"><h4>3. Xóa tháng này</h4><p class="muted sm">${ks.length<2?'Đây là tháng duy nhất nên chưa thể xóa.':'Xóa hẳn tháng này cùng số điện nước và tiền đã thu. Bản lưu tự động được tạo ngay trước khi xóa nên vẫn khôi phục được ở Cài đặt.'}</p>
      <div><button class="btn danger" id="mmDel" ${ks.length<2?'disabled':''}>${icon('trash',14)}Xóa ${monthLabel(k).toLowerCase()}</button></div></div>`,
    `<button class="btn" data-act="mclose">Đóng</button>`);
  $('#mmRen').onclick=async()=>{const nk=$('#mmk').value;
    if(!/^\d{4}-\d{2}$/.test(nk))return toast('Hãy chọn tháng','bad');
    if(nk===k){closeModal(true);return}
    if(DB.months[nk])return toast(monthLabel(nk)+' đã tồn tại, hãy chọn tháng khác hoặc xóa tháng đó trước','bad');
    await snapshot('Trước khi đổi '+monthLabel(k).toLowerCase()+' sang '+monthLabel(nk).toLowerCase());
    DB.months[nk]=m;delete DB.months[k];closeModal(true);save();setMonth(nk);toast('Đã đổi thành '+monthLabel(nk).toLowerCase())};
  $('#mmReset').onclick=()=>{closeModal(true);confirmBox('Làm lại '+monthLabel(k).toLowerCase(),
    `Mọi số điện nước đã nhập (${nIn} phòng) và ${nPay} lần thu tiền của tháng này sẽ bị xóa, tháng được tạo lại từ ${pk?monthLabel(pk).toLowerCase():'đầu'}. Bản lưu tự động được tạo trước khi làm.`,'Làm lại',async()=>{
      await snapshot('Trước khi làm lại '+monthLabel(k).toLowerCase());createMonth(k);save();UI.view='entry';setMonth(k);toast('Đã làm lại '+monthLabel(k).toLowerCase())})};
  $('#mmDel').onclick=()=>{closeModal(true);confirmBox('Xóa '+monthLabel(k).toLowerCase(),
    `Xóa hẳn ${monthLabel(k).toLowerCase()}${m.locked?' (đã chốt)':''}: ${nIn} phòng đã nhập số, ${nPay} lần thu tiền sẽ mất. Bản lưu tự động được tạo trước khi xóa.`,'Xóa tháng',async()=>{
      await snapshot('Trước khi xóa '+monthLabel(k).toLowerCase());
      const rest=monthKeys().filter(x=>x!==k),go=rest.filter(x=>x<k).pop()||rest[0];
      delete DB.months[k];save();setMonth(go);toast('Đã xóa '+monthLabel(k).toLowerCase())})};
}
function newMonthModal(){
  const ks=monthKeys(),next=addMonths(ks[ks.length-1],1);
  openModal('Tạo tháng mới',`<label class="f">Tháng<input type="month" id="nmk" value="${next}"></label>
    <ul style="margin:0;padding-left:18px" class="muted"><li>Số điện, số nước <b>cũ</b> lấy từ số <b>mới</b> của tháng trước.</li><li>Nợ tháng trước tự tính từ phần chưa thu (âm nếu khách trả dư).</li><li>Đơn giá, số người, tiền rác/internet/cáp/ANQP lấy từ tháng trước và cài đặt phòng.</li><li>Chỉ tính các phòng đang có khách.</li></ul>`,
    `<button class="btn" data-act="mclose">Hủy</button><button class="btn primary" id="nmGo">Tạo tháng</button>`);
  $('#nmGo').onclick=()=>{const k=$('#nmk').value;if(!/^\d{4}-\d{2}$/.test(k))return toast('Hãy chọn tháng','bad');if(DB.months[k]){closeModal(true);setMonth(k);return toast('Tháng này đã có, đã mở sẵn cho bạn')}
    closeModal(true);createMonth(k);save();UI.view='entry';setMonth(k);toast('Đã tạo '+monthLabel(k).toLowerCase())};
}

/* ---------- khởi động ---------- */
/* ---------- Đăng nhập: chỉ cho vào khi tài khoản Google đúng ---------- */
const AUTH_EMAIL='hoangvucntt@gmail.com',AUTH_KEY='tientro.auth',AUTH_TTL=12*3600*1000;
function authOK(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');return !!a&&a.email===AUTH_EMAIL&&Date.now()<a.exp}catch(e){return false}}
function authSet(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({email:AUTH_EMAIL,exp:Date.now()+AUTH_TTL}))}catch(e){}}
function authClear(){try{localStorage.removeItem(AUTH_KEY)}catch(e){}}
const DEFAULT_OTP_URL='https://script.google.com/macros/s/AKfycbxeGnmy3hFh0jHO4uULG61r2jOH2SERkiQ2RUUwoBHo9JsWIbtxoQMBGUhbYO0mZ4gw/exec'; // Dán sẵn địa chỉ Apps Script (…/exec) vào đây nếu muốn, khỏi nhập ở màn hình đăng nhập
const OTP_KEY='tientro.otpurl';
function otpUrl(){let u='';try{u=localStorage.getItem(OTP_KEY)||''}catch(e){}return u||DEFAULT_OTP_URL}
async function otpCall(a,extra){
  const u=otpUrl();if(!u)throw new Error('Chưa có địa chỉ dịch vụ gửi mã');
  let r;try{r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a},extra||{}))})}catch(e){throw new Error('Không kết nối được dịch vụ gửi mã, kiểm tra mạng và địa chỉ đã dán')}
  let j;try{j=await r.json()}catch(e){throw new Error('Địa chỉ dịch vụ không đúng hoặc chưa triển khai "Bất kỳ ai"')}
  if(!j.ok)throw new Error(j.error||'Có lỗi xảy ra');return j;
}
function loginScreen(){return new Promise(done=>{
  const el=document.createElement('div');el.id='login';
  let step='start',err='',info='',cool=0,tick=null,editUrl=false;
  const draw=()=>{
    const needUrl=!otpUrl()||editUrl;
    el.innerHTML=`<div class="box"><img src="${BRAND.logo}" alt=""><h1>${esc(BRAND.name)}</h1><p>Đăng nhập để sử dụng ứng dụng</p>
    <div class="em">${esc(AUTH_EMAIL)}</div>
    ${step==='start'?`${needUrl?`<input id="lurl" type="text" placeholder="Dán địa chỉ dịch vụ gửi mã (làm một lần)" autocomplete="off" spellcheck="false" value="${esc(otpUrl())}">`:''}
      <button class="go" id="lgsend">Gửi mã xác minh về Gmail</button>`
    :`<input id="lcode" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="Nhập mã 6 số" style="text-align:center;font-size:20px;letter-spacing:4px">
      <button class="go" id="lgok">Xác nhận</button>
      <button class="go" id="lgre" style="background:transparent;color:var(--accent);margin-top:8px;font-weight:500" ${cool>0?'disabled':''}>${cool>0?`Gửi lại mã sau ${cool}s`:'Gửi lại mã'}</button>`}
    ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
    ${info?`<p class="hint">${esc(info)}</p>`:''}
    ${step==='start'&&!needUrl?'<p class="hint"><a href="#" id="lgurl" style="color:var(--accent)">Đổi địa chỉ dịch vụ gửi mã</a></p>':''}
    <p class="hint">${step==='start'?'Mã xác minh 6 số sẽ được gửi tới email trên. Kiểm tra cả mục Thư rác nếu chưa thấy.':'Mã có hiệu lực 10 phút.'}</p></div>`;
    const b=$('#lgsend',el);if(b)b.onclick=()=>send(b);
    const ok=$('#lgok',el);if(ok){ok.onclick=()=>verify(ok);const c=$('#lcode',el);c.focus();c.oninput=()=>{c.value=c.value.replace(/\D/g,'');if(c.value.length===6)verify(ok)}}
    const re=$('#lgre',el);if(re)re.onclick=()=>send(re);
    const cu=$('#lgurl',el);if(cu)cu.onclick=e=>{e.preventDefault();editUrl=true;err='';draw()};
  };
  const startCool=()=>{cool=45;clearInterval(tick);tick=setInterval(()=>{cool--;if(cool<=0){clearInterval(tick);cool=0}const re=$('#lgre',el);if(re){re.disabled=cool>0;re.textContent=cool>0?`Gửi lại mã sau ${cool}s`:'Gửi lại mã'}},1000)};
  const send=async(b)=>{
    const ui=$('#lurl',el);
    if(ui){const v=ui.value.trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(v)){err='Địa chỉ không đúng định dạng (phải bắt đầu bằng https://script.google.com/macros/s/ và kết thúc bằng /exec)';return draw()}try{localStorage.setItem(OTP_KEY,v)}catch(e){}}
    b.disabled=true;b.textContent='Đang gửi mã…';
    try{await otpCall('send');err='';info='Đã gửi mã tới '+AUTH_EMAIL;step='code';startCool();draw()}
    catch(e){err=e.message;editUrl=true;step='start';draw()}
  };
  const verify=async(b)=>{
    const code=($('#lcode',el).value||'').trim();if(code.length!==6){err='Hãy nhập đủ 6 số';return draw()}
    b.disabled=true;b.textContent='Đang xác nhận…';
    try{await otpCall('verify',{code});authSet();clearInterval(tick);el.remove();done()}
    catch(e){err=e.message;info='';draw()}
  };
  draw();document.body.appendChild(el);
})}
async function boot(){
  if(!authOK())await loginScreen();
  return boot0();
}
async function boot0(){
  DB=loadLocal();
  if(!DB){DB=makeSeed();persistLocal()}else if(fillCCCD(DB)){persistLocal()}
  sortRooms();UI.view=NAV.some(n=>n.id===CFG.view)?CFG.view:'dash';ensureMonthSelected();
  try{if(!DB.history)DB.history=[]}catch(e){}
  await loadSnaps();render();
  window.addEventListener('beforeunload',flushAll);window.addEventListener('beforeunload',e=>{if(Sync.driver&&DB.rev>CFG.syncRev){e.preventDefault();e.returnValue=''}});window.addEventListener('pagehide',flushAll);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flushAll();else Sync.checkRemote()});
  window.addEventListener('focus',()=>Sync.checkRemote());
  setInterval(()=>{if(!document.hidden)Sync.checkRemote()},60000);
  window.addEventListener('online',()=>{if(Sync.driver&&Sync.state==='error')Sync.push()});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){} // xin trình duyệt không tự xóa dữ liệu/kết nối đã nhớ
  if(CFG.driver)Sync.startup();else setSync('local');
  // Trình duyệt chỉ cho cấp lại quyền/đăng nhập khi người dùng chạm vào trang: thử đúng một lần ở lần chạm đầu tiên, không báo lỗi
  let autoTried=false;
  const gest=e=>{if(autoTried||!Sync.driver||Sync.state!=='needauth'||Sync.busy)return;if(e.target.closest&&e.target.closest('[data-act="syncchip"]'))return;autoTried=true;reauth(true)};
  document.addEventListener('pointerdown',gest,true);document.addEventListener('keydown',gest,true);
}
boot();

})();
